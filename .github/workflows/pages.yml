# Test, then publish the site to GitHub Pages. Turn Pages on in the repository settings (Source: GitHub Actions).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node tools/validate.js
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html bench.html gm.html _site/
          # assets/: the Pixel Crawler sprites and tiles (tracked; the paid packs are git-ignored and never here).
          # Without it the map draws every figure as a coloured block.
          cp -r css src data assets _site/
          rm -f _site/data/bundle.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
