# The open world of the first continent (W1), laid out by tools/worldgen.js into data/outdoors.yaml.
#   node tools/worldgen.js assets/world/w1-layout.yaml [--preview out.ppm]
# The continent's terrain comes from `cells` (an extract of the reference world's 0.5-degree raster: biome, elevation,
# relief, rivers by Strahler order, lakes, swamp). Every land slot of the grid becomes one outdoor place, `size`
# squares a side; walkable squares that meet across a shared edge are a way across (the exits run the whole edge).
# Sites are stamped over the terrain: towns' gates, dungeons' doors and what stood round them, with their legend
# entries and encounters. A first draft (2026-11-24): the terrain is a scaffold to craft over, not finished maps.

cells: assets/world/w1-cells.csv
seed: 103
prefix: bz_                 # place ids: bz_<row>_<col>
grid: {lon0: -117.5, lat0: 22.5, step: 5, cols: 13, rows: 11, size: 40}
continent: [-86.25, -0.25]  # a land cell on the continent: its connected land is the continent
minLand: 8                  # a slot with fewer land cells than this is left out (unless a site is in it)
home: stonebridge           # levels rise with the distance in places from this site
level: {base: 1, per: 0.6, max: 10}

tileset: w1                 # every place draws from it, so land runs on across a place's edge as it lies

# How the cells' figures become ground (tools/worldgen.js "Terrain classes"). Heights in km; `arid` is the cells'
# rainfall over what the sun could take up (below 0.2 desert, 0.2-0.5 semi-arid, above 1 wet).
terrain:
  upland: {elev: 0.75, noise: 0.1}        # land above this height is highland (region H); its edge wanders by `noise`
  scarp: {band: 0.07, wide: 1.8, hill: 0.035, rock: 0.07}   # the upland's rim: within `band` km of its height (or
                                          # `wide` squares' rise, if more), hillside where the land rises `hill` km a
                                          # square or more, rock from `rock`; where it rises less, a way up
  swamp: {below: 0.2, relief: 0.3, wet: 1.0, river: 3, noise: 0.52}   # swamp only on land below `below` with local
                                          # relief under `relief`, wet (`arid` over `wet`) or by a river of order
                                          # `river`; in patches (`noise`)
  arid: {dry: [0.25, 0.65], trees: 0.6}   # dry grass everywhere drier than the first figure, in shrinking patches up to
                                          # the second; no trees drier than `trees`
  streams: {strahler: 1, width: 0.35, spring: 1.6}   # rivers from this order up (the first order a stream a square wide);
                                          # a head out on open land rises from a spring pond about `spring` squares across
  falls: {drop: 0.4, char: "≀", label: "A waterfall, loud over the rim"}   # a waterfall where a river drops this much (km)
                                          # from one cell to the next, flowing south

# Regions: each square's is the raster's biome there (grassland and temperate forest G, jungle J, desert D; above
# `terrain.upland` the highland H, save the desert), its edge
# wandering a few squares by noise so one runs into the next in tongues and islands, not along a place's edge. A
# mountain, hill, canopy or swamp takes the region most of it lies in. `chars`: the letters for each terrain class
# (rules.yaml game.ground); `look`: a place's light and colours, by the region most of it is; `scatter`: props by class
# (`shore` beside a lake or river; `edge` within three squares of another region, by that region).
regions:
  G:
    look: {wall: "#4a5a3a", floor: "#4f9a3c", ceiling: "#9ab8d6", fog: "#0c120a", torch: 0, light: 28}
    mossBand: 1
    dryBand: 2          # squares of dry grass where the grassland meets the desert
    chars: {ocean: "~", lake: "~", river: "∽", stream: "_", swamp: "≃", ground: ",", moss: "∻", dry: "∵", woods: ",", forest: "}", hill: "{", mountain: "#", ledge: "(", summit: "?", sand: "░", road: ".", bridge: "=", ford: "≠", rim: "▪", gorge: ",", crag: "▨", cledge: "◫", csummit: "⊞"}
    scatter:
      ground: {oak: 0.003, broadleaf: 0.002, gbush: 0.006, grass_tuft: 0.03, meadow: 0.02, wildflowers: 0.015, flowerbush: 0.004, boulder: 0.002}
      dry: {tallgrass_gold: 0.05, drygrass: 0.02, acacia: 0.008, boulder: 0.004}
      woods: {oak: 0.14, broadleaf: 0.06, birch: 0.06, pine: 0.04, gbush: 0.05, grass_tuft: 0.04}
      hill: {boulder: 0.02, pine: 0.012, grass_tuft: 0.03}
      swamp: {reeds: 0.12, mossdead: 0.02}
      sand: {pebbles: 0.01, drygrass: 0.01}
      gorge: {grass_tuft: 0.05, boulder: 0.02, rocks: 0.012, gbush: 0.008, dead_tree: 0.004}   # a ravine's floor (a gorge, a pass)
      shore: {reeds: 0.2}
      edge: {J: {kapok: 0.025, gbush: 0.04, ferns: 0.04}, D: {drygrass: 0.05, thornbush: 0.01}}
    # Grazing herds on the open grass (tools/worldgen.js "Herds"): docile, they fight only if attacked.
    herds:
      per: 4
      gap: 9
      clear: 3
      list:
        - {w: 3, label: "Guar grazing", foes: [{monster: guar, n: 2}], text: "The guar lift their heads, chewing. One hisses and stamps; neither runs."}
        - {w: 1, label: "A guar", foes: [{monster: guar}], text: "The guar stops chewing and backs off a step, hissing."}
        - {w: 2, label: "An Eolambia grazing", foes: [{monster: eolambia}], text: "The Eolambia swings round, tail low, and bellows."}
        - {w: 1, label: "Eolambia grazing", foes: [{monster: eolambia, n: 2}], text: "The pair bellow and turn to face you, tails sweeping the grass."}
  J:
    look: {wall: "#24381f", floor: "#4a3a28", ceiling: "#2a3a22", fog: "#0c120a", torch: 0, light: 24}
    mossBand: 2
    murky: true         # its rivers run as swamp water, ringed with marsh
    chars: {ocean: "~", lake: "~", river: "∽", stream: "_", swamp: "≈", pool: "≋", ground: "∷", moss: "∻", dry: "∷", woods: "∷", forest: "]", hill: "∩", mountain: "▵", ledge: "▴", summit: "▴", sand: "░", road: "≡", bridge: "=", ford: "≠", rim: "▪"}
    scatter:
      ground: {kapok: 0.02, strangler: 0.01, bush: 0.025, ferns: 0.03}
      woods: {kapok: 0.14, strangler: 0.07, mossoak: 0.04, mossleaning: 0.03, ferns: 0.05}
      swamp: {mangrove: 0.06, cypress: 0.04}
      hill: {mossoak: 0.02, ferns: 0.03}
      sand: {palm: 0.03, youngpalm: 0.02}
      shore: {reeds: 0.12}
      edge: {G: {oak: 0.015, grass_tuft: 0.04}}
  H:
    look: {wall: "#4a5560", floor: "#5a9a48", ceiling: "#a8c0d8", fog: "#0e1418", torch: 0, light: 28}
    mossBand: 1
    chars: {ocean: "~", lake: "~", river: "∽", stream: "_", swamp: ",", ground: ",", moss: "∻", dry: "∵", woods: ",", forest: "}", hill: "{", mountain: "#", ledge: "(", summit: "?", sand: "░", road: ".", bridge: "=", ford: "≠", rim: "▪", gorge: ",", crag: "▨", cledge: "◫", csummit: "⊞"}
    scatter:
      ground: {pine: 0.004, birch: 0.003, boulder: 0.006, rocks: 0.003, grass_tuft: 0.03, meadow: 0.012, wildflowers: 0.006, standing_stone: 0.0004}
      dry: {tallgrass_seed: 0.03, drygrass: 0.02, boulder: 0.008, rocks: 0.006, pine: 0.002}
      woods: {pine: 0.12, fir: 0.08, birch: 0.05, mossoak: 0.03, boulder: 0.01, ferns: 0.02}
      hill: {boulder: 0.025, pine: 0.015, rocks: 0.01, grass_tuft: 0.03}
      sand: {pebbles: 0.01}
      gorge: {grass_tuft: 0.05, boulder: 0.02, rocks: 0.012, gbush: 0.008, dead_tree: 0.004}
      shore: {rocks: 0.05, boulder: 0.03, reeds: 0.04}                  # stony shores: a highland lake has no marsh
      edge: {J: {mossoak: 0.03, ferns: 0.04}, G: {oak: 0.01, grass_tuft: 0.03}}
  D:
    look: {wall: "#8a4a2a", floor: "#d8b878", ceiling: "#9ab8d6", fog: "#1a140a", torch: 0, light: 28}
    chars: {ocean: "~", lake: "~", river: "∽", stream: "_", swamp: ",", ground: "░", dry: "░", woods: "░", forest: "░", hill: "░", mountain: "▧", ledge: "▧", summit: "▧", sand: "░", road: "░", bridge: "=", ford: "≠", rim: "▧"}
    scatter:
      ground: {thornbush: 0.01, drygrass: 0.03, aloe: 0.006, pebbles: 0.012, boulder: 0.004, skull: 0.001, deadtree: 0.003}
      swamp: {palm: 0.1, palms: 0.04, grass_tuft: 0.04}
      shore: {desert_reeds: 0.25, palm: 0.06}
      edge: {G: {drygrass: 0.05, bush: 0.02}}

