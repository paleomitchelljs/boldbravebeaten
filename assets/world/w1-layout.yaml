      - "··+······+·······+····"
      - "··++++++++++++++++++··"
      - "··+··1·w·+··2····+····"
      - "·P+l·····+······l+M···"
      - "··+···3··+··4····+····"
      - "··+++++++a++++++++++··"
      - "··+··5·T·+···6···+····"
      - "·xxx····xxx·7···xxx8··"
      - "·xcx····xcx·····xcx···"
      - "······················"
