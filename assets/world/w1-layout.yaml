# The open world of the first continent (W1), laid out by tools/worldgen.js into data/outdoors.yaml.
#   node tools/worldgen.js assets/world/w1-layout.yaml [--preview out.ppm]
# The continent's terrain comes from `cells` (an extract of the reference world's 0.5-degree raster: biome, elevation,
# relief, rivers by Strahler order, lakes, swamp). Every land slot of the grid becomes one outdoor place, `size`
# squares a side; walkable squares that meet across a shared edge are a way across (the exits run the whole edge).
# Sites are stamped over the terrain: towns' gates, dungeons' doors and what stood round them, with their legend
# entries and encounters. A first draft (2026-11-24): the terrain is a scaffold to craft over, not finished maps.

cells: assets/world/w1-cells.csv
seed: 103
prefix: bz_                 # place ids: bz_<row>_<col>
grid: {lon0: -117.5, lat0: 22.5, step: 5, cols: 13, rows: 11, size: 40}
continent: [-86.25, -0.25]  # a land cell on the continent: its connected land is the continent
minLand: 8                  # a slot with fewer land cells than this is left out (unless a site is in it)
home: stonebridge           # levels rise with the distance in places from this site
level: {base: 1, per: 0.6, max: 10}

# How each family draws the abstract terrain classes. A class missing from a family falls back along `stand`, and the
# fallback is written to the gap report (assets/world/w1-gaps.md) as a kludge to make art for.
families:
  w1_wild:
    tileset: w1_wild
    look: {wall: "#4a5a3a", floor: "#4f9a3c", ceiling: "#9ab8d6", fog: "#0c120a", torch: 0, ground: ",", light: 28}
    chars: {ocean: "~", lake: "~", river: "~", ground: ",", dry: "∴", forest: "}", hill: "{", scree: "`", mountain: "#", ledge: "(", summit: "?", road: ".", bridge: "="}
    stand: {jungle: forest, swamp: pools, sand: ground, shallows: bridge}
    props:
      t: {sprite: oak, label: "An oak"}
      i: {sprite: birch, label: "A birch"}
      p: {sprite: pine, label: "A pine"}
      g: {sprite: tallgrass_gold, solid: false, label: "Tall grass"}
      o: {sprite: boulder, label: "A boulder"}
      r: {sprite: reeds, solid: false, label: "Reeds"}
      k: {sprite: kapok, label: "A jungle tree"}
    scatter: {ground: {t: 0.012, i: 0.006, g: 0.02, o: 0.004}, dry: {g: 0.02, o: 0.01}, forestEdge: {p: 0.03}, jungleAsForest: {k: 0.02}, pools: {r: 0.25}}
  w1_jungle:
    tileset: w1_jungle
    look: {wall: "#24381f", floor: "#4a3a28", ceiling: "#2a3a22", fog: "#0c120a", torch: 0, ground: ".", light: 24}
    chars: {ocean: "~", lake: "~", river: "~", ground: ".", jungle: "]", swamp: "≈", shallows: "_", road: "≡", bridge: "_"}
    stand: {forest: jungle, dry: ground, hill: ground, scree: ground, mountain: jungle, ledge: jungle, summit: jungle, sand: swamp}
    props:
      k: {sprite: kapok, label: "A kapok tree"}
      m: {sprite: mangrove, label: "A mangrove"}
      s: {sprite: strangler, label: "A strangler fig"}
      c: {sprite: cypress, label: "A cypress"}
    scatter: {ground: {k: 0.01, s: 0.006}, swamp: {m: 0.03, c: 0.02}, grassAsFloor: {k: 0.004}}
  w1_desert:
    tileset: w1_desert
    look: {wall: "#8a4a2a", floor: "#d8b878", ceiling: "#9ab8d6", fog: "#1a140a", torch: 0, ground: ".", light: 28}
    chars: {ocean: "~", lake: "~", river: "~", ground: ".", dry: ".", forest: ",", hill: "`", scree: "`", mountain: "#", ledge: "(", summit: "?", shallows: "_", road: "`", bridge: "_", oasis: ","}
    stand: {jungle: forest, swamp: oasis}
    props:
      a: {sprite: palm, label: "A palm"}
      b: {sprite: thornbush, label: "A thornbush"}
      d: {sprite: drygrass, solid: false, label: "Dry grass"}
      o: {sprite: boulder, label: "A boulder"}
    scatter: {ground: {b: 0.01, d: 0.03, o: 0.006}, oasis: {a: 0.08}}

# Families by the slot's land: the biome most of it is (G grassland, F temperate forest, J jungle, D desert).
familyOf: {G: w1_wild, F: w1_wild, J: w1_jungle, D: w1_desert}
# Slot overrides: [row, col]: {family, name, blurb}
slots:
  "5,8": {family: w1_wild, name: "Exeomo", blurb: "High grassland round the caldera of Exeomo: a ring of black peaks, jungle in the crater, a mine cut into the rim."}
  "6,8": {name: "Shiwgoiwo", blurb: "Grassland and jungle edge round the frontier village of Shiwgoiwo, roads out to every side."}
  "6,9": {name: "The Temple Swamp", blurb: "Jungle and swamp east of Shiwgoiwo, and the old temple of the lizardfolk in it."}
  "6,10": {name: "Lake Eyenuma", blurb: "Forest down to a great lake, and a fortress of grey-green stone on its shore."}
  "7,9": {name: "The Orc Valley", blurb: "Forested highlands, and in them a valley where the orc legion keeps its castle and works its slaves in a quarry."}
  "6,6": {name: "The Red Labyrinth", blurb: "Dry plateau broken by a maze of red rock, and minotaurs in it."}
  "6,0": {name: "The Western Desert", blurb: "Sand and red rock on the western coast, an oasis lake and a ruined tower on an island in it."}
  "1,7": {name: "Zhomelonga", blurb: "Jungle and rivers round the capital of the Hegemony."}
  "2,4": {name: "Muawea", blurb: "Jungle coast round the lizardfolk city of Muawea."}
  "5,2": {name: "Iitanii", blurb: "The Naalda's grassland round the frontier city of Iitanii."}
  "8,8": {name: "Isdi", blurb: "Forest and coast round Isdi, the seat of Barjiy."}
  "9,1": {name: "Emagshir", blurb: "The dry southwestern tip and the port of Emagshir."}

# Sites: a stamp laid with its centre at `at` (lon, lat). In a stamp, a letter in its `legend` is that entry; a ground
# letter is that ground; `·` is the family's plain ground, `+` its road, a space leaves the terrain as it is; digits
# 1-8 are recruits' home squares (reported, laid as ground).
# `road: [site...]` joins it by road. `ring` raises a caldera round the centre (inner, rim, outer radii in squares).
