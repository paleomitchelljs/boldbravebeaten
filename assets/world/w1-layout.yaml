# Sites: a stamp laid with its centre at `at` (lon, lat). In a stamp, a letter in its `legend` is that entry; a ground
# letter is that ground; `·` is the region's plain ground, `+` its road, a space leaves the terrain as it is; digits
# 1-8 are recruits' home squares (reported, laid as ground).
# `road: [site...]` joins it by road. `ring` raises a caldera round the centre (inner, rim, outer radii in squares).
# `pass` and `gorge` carve a canyon into raised rock across as many places as it runs through (tools/worldgen.js
# "Canyons"; highpass and the labyrinth below show the keys): `routes` (lines through the world's squares), `rooms` with
# `marks`, `ponds`, `walls` (squares deep), `mouths` (where it opens onto the land round it), `top` (the highest tier of
# its rock); a pass's routes carry a road, through its `gates`. Their marks are legend letters as in a stamp.
sites:
  - id: stonebridge
    at: [-75.6, -9.4]
    road: [highpass, exeomo, temple, sarnak, orcs, isdi, labyrinth]
    stamp:
      - "······················"
      - "·xxx····xxx·····xxx···"
      - "·xIx····xkx·····xhx···"
      - "··+······+·······+····"
      - "··++++++++++++++++++··"
      - "··+··1·w·+··2····+····"
      - "·P+l·····+······l+M···"
      - "··+···3··+··4····+····"
      - "··+++++++a++++++++++··"
      - "··+··5·T·+···6···+····"
      - "·xxx····xxx·7···xxx8··"
      - "·xcx····xcx·····xcx···"
      - "······················"
    legend:
      I: {kind: stairs, to: stonebridge, sprite: inn, scale: 1.2, label: "The Tilted Cask (the inn)", on: ","}
      k: {kind: prop, sprite: smithy, label: "The smithy", on: ","}
      h: {kind: prop, sprite: shop, label: "The shop", on: ","}
      c: {kind: prop, sprite: cottage, label: "A cottage", on: ","}
      x: {kind: prop, sprite: none, on: ","}
      w: {kind: prop, sprite: well, label: "The well", on: ","}
      l: {kind: prop, sprite: lamppost, label: "A lamp post", on: ","}
      a: {kind: prop, sprite: signpost, solid: false, label: "A signpost: the roads to the mine, the temple, the lake, the valley, Isdi and the plateau", on: "."}
      P: {kind: npc, npc: warden_ysa, sprite: wizard, label: "Warden Ysa, priest of the Lantern", services: {place: stonebridge, location: lantern_house}, on: ","}
      M: {kind: npc, npc: guildmaster_pell, sprite: rogue, label: "Guildmaster Pell, merchant", services: {place: stonebridge, location: market}, on: ","}
      T: {kind: npc, sprite: knight, label: "The drillmaster", services: {place: stonebridge, location: yard}, on: ","}

  - id: wolves
    at: [-76.9, -10.75]
    stamp:
      - "·····"
      - "·····"
      - "··F··"
      - "·····"
    legend:
      F: {kind: monster, encounter: wolves, label: "Chokidai at a kill", on: ","}
    encounters:
