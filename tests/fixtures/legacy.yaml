# The first dungeons (the Undercroft, the Hollow Barrow, Gallows Cave) and the town quests that ran through them.
# Retired from the game (the user, 2026-10-28: the temple is the default now); kept here because the engine tests
# use their doors, traps, locks, sleepers and quest chains. tests/legacy.js merges this over the loaded content.

places:
  undercroft_1:
    name: The Undercroft
    kind: dungeon
    blurb: Cellars beneath a burned mill. Somebody has been keeping them dry.
    level: 1
    look: {wall: "#6e5f4d", floor: "#3a3228", ceiling: "#241e18", fog: "#0e0b09", torch: 0.9}
    map:
      - "#########################"
      - "#<...#.......#u......x###"
      - "#....+...r...#........###"
      - "#....#.......+...T....sc#"
      - "#....#.......#t......x###"
      - "##.###.......############"
      - "##.######.###############"
      - "##+######............C###"
      - "#xx......#.#######.######"
      - "#b..g....#.#######.######"
      - "#b.......+.#######.######"
      - "#.k......#M#######.######"
      - "#........#N#######L######"
      - "###############..!..>.###"
      - "#########################"
    legend:
      "<": {kind: stairs, to: stonebridge, at: ~, label: "Up to the mill"}
      ">": {kind: stairs, to: undercroft_2, at: "<", label: "Down to the lower cellars"}
      r: {kind: monster, encounter: rat_nest, label: "Rat nest"}
      g: {kind: monster, encounter: guards_one, asleep: true, label: "Sleeping guards"}
      T: {kind: trap, tn: 8, disarm: 8, label: "Dart trap", damage: {CON: 1}, text: "A tripwire. Darts hiss out of the wall."}
      k: {kind: pickup, good: cellar_key, text: "A rusted key hangs on a nail by the cots."}
      C: {kind: chest, label: "Smugglers' cache", loot: smuggler_cache, tn: 6}
      c: {kind: chest, label: "Hidden strongbox", loot: strongbox, tn: 11}
      s: {kind: secret, tn: 8, label: "Hidden door"}
      L: {kind: locked, label: "Iron-banded door", tn: 8, forceTn: 11, key: cellar_key}
      M: {kind: locked, label: "Cell door", tn: 6, forceTn: 8, key: cellar_key}
      N: {kind: npc, npc: prisoner_tamsin}
      x: {kind: prop, sprite: crate, scale: 0.7}
      u: {kind: prop, sprite: urn, scale: 0.6}
      t: {kind: prop, sprite: candelabra, scale: 0.7}
      b: {kind: prop, sprite: bed, scale: 0.5}
      "!": {kind: note, text: "Scratched into the lintel: 'TOLL PAID IN FULL OR IN BLOOD. - R.'"}
    encounters:
      rat_nest: {foes: [{monster: ratPack}], flags: [cleared_rat_nest], loot: vermin_nest, text: "A sprawl of straw and bones. The rats are bigger than they ought to be."}
      guards_one: {foes: [{template: bandit, level: 1, n: 3}], text: "Three men sleep in their boots with a cask between them."}
    wandering:
      - {w: 3, foes: [{monster: rat, n: 3}], text: "Rats, drawn by the smell of food."}
      - {w: 1, foes: [{template: bandit, level: 1, n: 1}], text: "A sentry on his rounds."}
      - {w: 4, nothing: true}
    secrets:
      - {id: sec_cellar_mark, subject: "The cellar door", reveals: [divine, read], tier: easy, text: "The iron door is warded against fire. A smuggler's trick: they fear the Watch burning them out."}

  undercroft_2:
    name: The Lower Cellars
    kind: dungeon
    blurb: Barrels, boxes and the sort of order that comes from threat. A smuggler's headquarters.
    level: 2
    look: {wall: "#5f5546", floor: "#332c24", ceiling: "#1f1a15", fog: "#0c0907", torch: 0.9}
    map:
      - "#########################"
      - "#<.....##.............!##"
      - "#......P+..............##"
      - "#......##......R.......##"
      - "#......##..............##"
      - "###+#####..............##"
      - "###.#####..............##"
      - "#......#########+########"
      - "#....p.#########.########"
      - "#..g...##....#.........##"
      - "#.......V.C..#.......l.##"
      - "#########..q.#.........##"
      - "#########....#.........##"
      - "#########################"
      - "#########################"
    legend:
      "<": {kind: stairs, to: undercroft_1, at: ">", label: "Up to the cellars"}
      P: {kind: trap, tn: 6, disarm: 8, label: "Covered pit", damage: {CON: 1}, reveal: {flag: knows_lower}, text: "The boards give way. You fall onto old barrel staves."}
      R: {kind: monster, encounter: crew, label: "Rusk and his crew"}
      g: {kind: monster, encounter: store_guards, asleep: true, label: "Sleeping guards"}
      p: {kind: pickup, good: crate_goods, text: "A Guild crate, stamped and sealed. You can lift it, barely."}
      l: {kind: pickup, good: ledger, text: "A ledger in a worn oilcloth cover, in the captain's strongbox."}
      q: {kind: pickup, good: barrow_seal, text: "On a cushion in the vault: a stone disc cut with a closed eye."}
      C: {kind: chest, label: "Vault chest", loot: strongbox, tn: 8}
      V: {kind: locked, label: "Vault door", tn: 11, forceTn: 14, key: vault_key}
      "!": {kind: note, text: "A chalk tally on the beam, and under it: 'Don't open the east tunnel after dark.'"}
    encounters:
      crew: {foes: [{template: sellsword, level: 3, n: 1, name: "Captain Rusk"}, {template: bandit, level: 2, n: 3}], parley: captain_rusk, flags: [rusk_beaten], peaceFlags: [rusk_stands_down], text: "Barrels, lamps, and a heavy man in good mail who looks up from his accounts."}
      store_guards: {foes: [{template: bandit, level: 2, n: 2}], text: "Two guards asleep beside the crates."}
    wandering:
      - {w: 2, foes: [{template: bandit, level: 2, n: 2}], text: "A patrol, coming off shift."}
      - {w: 5, nothing: true}
    secrets: []

  barrow:
    name: The Hollow Barrow
    kind: dungeon
    blurb: A burial mound older than the town. Something under it has learned to walk.
    level: 3
    look: {wall: "#6d6a62", floor: "#2d2a26", ceiling: "#1a1816", fog: "#0a0908", torch: 0.8}
    map:
      - "###########################"
      - "#########.......H.#########"
      - "#########....K....#########"
      - "#########.........#########"
      - "#############.#############"
      - "#...#########.#########...#"
      - "#.!.#########D#########...#"
      - "#...#####.........#####.C.#"
      - "#.z..+.......k.......+....#"
      - "#...#####.........#####...#"
      - "#...#####.........#####.T.#"
      - "#...#########.#########...#"
      - "#############.#############"
      - "#############+#############"
      - "###########.....###########"
      - "###########..<..###########"
      - "###########################"
    legend:
      "<": {kind: stairs, to: stonebridge, at: ~, label: "Out to the road"}
      k: {kind: monster, encounter: squad, label: "Skeleton squad"}
      z: {kind: monster, encounter: horde, label: "Shambling dead"}
      K: {kind: monster, encounter: knight, label: "The knight under the hill"}
      C: {kind: chest, label: "Crypt chest", loot: barrow_hoard, tn: 11}
      H: {kind: chest, label: "The knight's hoard", loot: barrow_hoard, tn: 8}
      T: {kind: trap, tn: 11, disarm: 11, label: "Crushing slab", damage: {CON: 2}, text: "A slab drops from the ceiling."}
      "!": {kind: note, text: "Wall paintings of a knight kneeling before a closed eye. Someone has scratched out the eye."}
      D:
        kind: locked
        label: "The barrow door"
        tn: 99
        forceTn: 15
        alt:
          - {label: "Set the barrow seal in the recess", requires: {item: barrow_seal}, sets: [barrow_closed], takes: barrow_seal, seals: knight, text: "The disc clicks home. The door swallows its own handle. Behind it, something stops moving."}
          - {label: "Speak the words from the rubbing", requires: {flag: sec_barrow_door}, opens: true, text: "The words are ugly in the mouth. The door breathes out."}
    encounters:
      squad: {foes: [{monster: skeletonSquad}], text: "Three skeletons in rusted mail rise from the niches."}
      horde: {foes: [{monster: zombieHorde}], text: "The gallery is full of things that were people."}
      knight: {foes: [{monster: revenantKnight}], flags: [knight_slain], text: "He kneels before the far wall in black plate. He stands without hurry."}
    wandering:
      - {w: 2, foes: [{monster: zombie, n: 2}], text: "Shapes shuffle out of the dark."}
      - {w: 4, nothing: true}
    secrets:
      - {id: sec_barrow_door, subject: "The barrow door", reveals: [read, divine], tier: hard, text: "The recess takes a seal; the words around its edge, spoken, will open it without."}

  trollhole:
    name: Gallows Cave
    kind: dungeon
    blurb: A limestone cave north of the road. The bones at the entrance are too big for sheep.
    level: 3
    look: {wall: "#5a5a50", floor: "#2a2a24", ceiling: "#161613", fog: "#0a0a08", torch: 0.8}
    map:
      - "#######################"
      - "#######.......H.#######"
      - "#######....O....#######"
      - "#######.........#######"
      - "#######.........#######"
      - "#...#######.###########"
      - "#.c.........###########"
      - "#...#######.###########"
      - "#.P.#######+###########"
      - "########...w...########"
      - "########.......########"
      - "########...<...########"
      - "#######################"
    legend:
      "<": {kind: stairs, to: stonebridge, at: ~, label: "Out to the road"}
      w: {kind: monster, encounter: wolves, label: "Wolf pack"}
      O: {kind: monster, encounter: troll, label: "Cave troll"}
      H: {kind: chest, label: "Troll hoard", loot: troll_hoard, tn: 6}
      c: {kind: chest, label: "Dead traveller's pack", loot: strongbox, tn: 8}
      P: {kind: trap, tn: 8, disarm: 8, label: "Sinkhole", damage: {CON: 1}, text: "The floor is thin here. You slide down a chute of wet rock."}
    encounters:
      wolves: {foes: [{monster: wolfPack}], text: "Eyes in the dark; a low growl, then several."}
      troll: {foes: [{monster: caveTroll}], flags: [troll_slain], text: "It fills the passage and it has seen you."}
    wandering:
      - {w: 2, foes: [{monster: wolf, n: 2}], text: "Wolves, drawn by the smell of blood."}
      - {w: 4, nothing: true}
    secrets: []

quests:
  rats_in_cellars:
    name: Rats in the Cellars
    giver: captain_hollis
    faction: town_watch
    summary: The Watch wants the upper cellars under the old mill cleared.
    stages:
      - {text: "Clear the rat nest in the upper cellars (the Undercroft).", done_when: {flag: cleared_rat_nest}}
      - {text: "Report to Captain Hollis at the gate.", done_when: {flag: reported_rats}}
    reward: {gold: 40, xp: 60, standing: {town_watch: 8}, renown: 2}

  lost_shipment:
    name: The Lost Shipment
    giver: guildmaster_pell
    faction: merchants_guild
    exclusive: [crates_for_corvin]
    summary: Three crates of Guild goods went missing. Find them in the cellars.
    stages:
      - {text: "Find the Guild's crates in the Undercroft.", done_when: {item: crate_goods}}
      - {text: "Return the crates to Guildmaster Pell.", done_when: {flag: shipment_returned}}
    reward: {gold: 80, xp: 90, standing: {merchants_guild: 12, cutthroats: -6}, renown: 3}

  crates_for_corvin:
    name: Crates for Corvin
    giver: sly_corvin
    faction: cutthroats
    exclusive: [lost_shipment]
    summary: Corvin wants the Guild's crates delivered to him, not the Guild.
    stages:
      - {text: "Find the crates in the Undercroft.", done_when: {item: crate_goods}}
      - {text: "Deliver them to Corvin at the Tilted Cask.", done_when: {flag: crates_fenced}}
    reward: {gold: 120, xp: 90, standing: {cutthroats: 15, merchants_guild: -10, town_watch: -4}, notoriety: 3}

  smugglers_ledger:
    name: The Smugglers' Ledger
    giver: captain_hollis
    faction: town_watch
    summary: Captain Hollis wants Rusk's ledger to name names.
    stages:
      - {text: "Get Rusk's ledger from the lower cellar (by arms, by purse, or by stealth).", done_when: {item: ledger}}
      - {text: "Bring the ledger to Captain Hollis.", done_when: {flag: ledger_delivered}}
    reward: {gold: 100, xp: 140, standing: {town_watch: 15, cutthroats: -12}, renown: 4}

  barrow_seal:
    name: The Barrow Seal
    giver: warden_ysa
    faction: lantern_order
    summary: The seal that kept the Hollow Barrow shut was stolen. The Lantern wants it back.
    stages:
      - {text: "Recover the Barrow seal (somewhere below the old mill).", done_when: {item: barrow_seal}}
      - {text: "Bring the seal to Warden Ysa.", done_when: {flag: seal_returned}}
      - {text: "Set it in the barrow door and face what walks there.", done_when: {flag: barrow_closed}}
    reward: {gold: 200, xp: 300, standing: {lantern_order: 25, town_watch: 10, grave_cult: -20}, renown: 8}

npcs:
  captain_rusk:
    name: Captain Rusk
    title: Smuggler boss
    faction: cutthroats
    sprite: knight
    glyph: "🗡"
    look: Heavy coat, light hands. He has a ledger on his belt and a knife in his sleeve.
    attrs: {WIS: 7, WIL: 7, CHA: 6, INT: 7}
    disposition: -2
    willingness: 1
    courage: 7
    patience: 3
    temperament: [venal, loyal]
    interests: [coin, discretion, survival]
    greeting: "You walked a long way to die in my cellar. Or to sell me something."
    topics:
      - {id: pass, label: "We're only passing through.", need: 5, kind: pass, tag: survival, sets: [rusk_stands_down], once: true, text: "Fine. Take the east tunnel and don't come back this way. If I see Watch colors, our arrangement ends."}
      - {id: ledger_sale, label: "I'll buy your ledger.", need: 6, kind: trade, tag: coin, requires: {gold: 100}, sets: [ledger_bought], takes_gold: 100, gives: {good: ledger}, once: true, text: "A hundred. Don't spend it all on drink."}
      - {id: join, label: "Do you need hired steel?", need: 8, kind: favor, tag: coin, once: true, gives: {gold: 60}, standing: {cutthroats: 15}, text: "Maybe. Here is something on account. Do not mention this to the Watch."}

  prisoner_tamsin:
    name: Tamsin
    title: Cellar prisoner
    faction: ~
    sprite: rogue
    glyph: "⛓"
    look: Pale and thin, ropes marking her wrists. Says she is a courier.
    attrs: {WIS: 6, WIL: 5, CHA: 5, INT: 6}
    disposition: 3
    willingness: 6
    courage: 3
    patience: 5
    temperament: [moral]
    interests: [mercy, freedom]
    greeting: "Please. Is it the Watch? Please say it is the Watch."
    topics:
      - {id: freed, label: "Walk out. I'll cover you.", need: 0, kind: favor, once: true, sets: [tamsin_freed], renown: 3, standing: {town_watch: 3, cutthroats: -6}, gives: {good: vault_key}, text: "You don't know what this means. They keep a vault key on the second level, and I took it from the guard when he slept. Take it. I can't use it."}
      - {id: where, label: "What do you know about the lower level?", need: 1, kind: info, sets: [knows_lower], text: "A big room with the barrels. Rusk sleeps beyond it. There's a vault past a locked door, and a pit the guards laid in the corridor."}

# Topics added to town people who stay in the game.
npcTopics:
  old_dagmar:
    - {id: trolls, label: "Tell me about the cave north of the road.", need: 2, kind: info, sets: [knows_trolls], text: "Trolls. They regrow what you cut off. Burn them. Fire's the only thing that makes them stay down. And don't stand in the narrow of the cave. They'll break your shield and your arm together."}
  captain_hollis:
    - {id: rats, label: "Does the Watch need help?", need: 2, kind: quest, starts: rats_in_cellars, hide: {quest: rats_in_cellars}, text: "Rats in the cellars under the mill, bigger than they ought to be. Clear the upper level. I'll pay for proof, not stories."}
    - {id: rats_report, label: "The upper cellar is clear.", need: 0, kind: favor, requires: {flag: cleared_rat_nest}, hide: {flag: reported_rats}, sets: [reported_rats], text: "Good work. Here is what I promised. The Watch remembers its friends."}
    - {id: ledger, label: "Tell me about the smugglers.", need: 5, kind: quest, tag: order, starts: smugglers_ledger, hide: {quest: smugglers_ledger}, text: "A man called Rusk runs the cellar. He keeps books. Get me that ledger and I can finally name names."}
  guildmaster_pell:
    - {id: shipment, label: "Do you have work?", need: 3, kind: quest, starts: lost_shipment, hide: {quest: lost_shipment}, tag: profit, text: "Three crates of the Guild's goods went missing on the river road. I have reason to think they're in those cellars. Bring them back; the Guild pays well and remembers."}
    - {id: shipment_done, label: "I have the crates.", need: 0, kind: favor, requires: {item: crate_goods}, hide: {flag: shipment_returned}, sets: [shipment_returned], takes: crate_goods, text: "Marked, sealed, and intact. You are better than my guards."}
    - {id: smugglers, label: "Who is moving goods around the toll?", need: 5, kind: info, sets: [knows_rusk], text: "A man named Rusk. Bad for business. If you find him, you may tell him the Guild has long memories."}
  warden_ysa:
    - {id: barrow, label: "What lies beneath the hill?", need: 3, kind: info, sets: [knows_barrow], text: "The Hollow Barrow. An old burial. The Hollow Court wakes the dead there, and the seal on the door has gone missing. If it opens fully, the Watch will not be enough."}
    - {id: seal, label: "Can I help with the barrow?", need: 5, kind: quest, tag: mercy, starts: barrow_seal, hide: {quest: barrow_seal}, requires: {flag: knows_barrow}, text: "The barrow's seal was carried off to the old cellars by thieves who didn't know what it was. Bring it to me, and then we can close the door. Beware the knight that walks there."}
    - {id: seal_done, label: "I have the seal.", need: 0, kind: favor, requires: {item: barrow_seal}, hide: {flag: seal_returned}, sets: [seal_returned], takes: barrow_seal, text: "Thank you. It will be set again at dusk. You have done the town a service you will not hear of."}
  wren_urchin:
    - {id: secret, label: "How do I get into the cellars quietly?", need: 2, kind: info, tag: coin, sets: [knows_cellar_back], text: "The back is oiled, but there's a loose grate at the east end. Ask nicely, or walk in the front and meet the rats."}
    - {id: patrol, label: "When do the smugglers sleep?", need: 4, kind: info, tag: coin, sets: [knows_patrols], text: "Day. Mostly. The ones who stay up are the ones with the keys."}
  sly_corvin:
    - {id: job, label: "I hear certain goods need delivering.", need: 4, kind: quest, tag: discretion, starts: crates_for_corvin, hide: {quest: crates_for_corvin}, lie: true, text: "The Guild's crates in the cellar belong to us now. Bring them to me instead, and you'll find it pays better than the Guild's gratitude."}
    - {id: job_done, label: "I have the crates.", need: 0, kind: favor, requires: {item: crate_goods}, hide: {flag: shipment_returned}, sets: [crates_fenced], takes: crate_goods, text: "Wise. Here."}
    - {id: back, label: "Is there a quiet way into the cellars?", need: 5, kind: pass, tag: coin, once: true, sets: [cutthroat_pass], text: "Knock twice, say the word 'tallow.' They'll know you're ours. Don't make me regret it."}
    - {id: rusk, label: "Who runs the cellar?", need: 3, kind: info, sets: [knows_rusk], text: "Rusk. Sensible, as men with knives go. Take a purse and he might listen."}
goods:
  cellar_key:
    {name: Rusted cellar key, kind: key, value: 0, rarity: common, blurb: "Opens the iron door in the Undercroft."}
  vault_key:
    {name: Vault key, kind: key, value: 0, rarity: uncommon, blurb: "Heavy and new. Opens the lower vault."}
  barrow_seal:
    {name: Barrow seal, kind: key, value: 0, rarity: unique, blurb: "A stone disc cut with a closed eye. The temple wants it back."}
  crate_goods:
    {name: Crate of marked goods, kind: trade, value: 90, rarity: uncommon, blurb: "Bears the Merchants' Guild stamp. Someone paid for this and never got it."}
  ledger:
    {name: Smugglers' ledger, kind: trade, value: 20, rarity: uncommon, blurb: "Names, dates, weights. The Watch would pay for it; so would the people in it."}
  scrap_barrow:
    {name: Rubbing of the barrow door, kind: book, value: 10, rarity: uncommon, reveals: [sec_barrow_door], blurb: "A charcoal rubbing of carved marks."}
