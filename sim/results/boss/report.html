/* Layout: a crawl report. How far each lineup gets (survival curves), what each member adds
   (paired marginal value), who does the work, then the rooms themselves as small maps.
   Same tokens as the arena and monster pages, so the three read as a set. */
:root {
  --bg: #e7e9e4; --surface: #f5f6f2; --surface-2: #eceee9; --ink: #1b2220; --muted: #59645f; --line: #c6ccc5;
  --accent: #2b6a5c; --brass: #8d6d22;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --base: #8b938e;
  --t-wall: #6b665c; --t-pit: #3b342c; --t-rough: #cdbf9f; --t-dark: #2b2d3a; --t-hot: #e2884d; --t-trap: #b0352f; --t-party: #2a78d6; --t-foe: #b0352f;
  --font-display: 'Grenze', 'Palatino Linotype', Palatino, Georgia, serif;
  --font-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141918; --surface: #1d2422; --surface-2: #232b29; --ink: #e2e6e1; --muted: #98a49f; --line: #33403c;
    --accent: #5db09d; --brass: #c7a24f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --base: #7d8783;
    --t-wall: #8a8475; --t-pit: #0c0b09; --t-rough: #6c6248; --t-dark: #3d4054; --t-hot: #c4642c; --t-trap: #e57a72; --t-party: #3987e5; --t-foe: #e57a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141918; --surface: #1d2422; --surface-2: #232b29; --ink: #e2e6e1; --muted: #98a49f; --line: #33403c;
  --accent: #5db09d; --brass: #c7a24f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --base: #7d8783;
  --t-wall: #8a8475; --t-pit: #0c0b09; --t-rough: #6c6248; --t-dark: #3d4054; --t-hot: #c4642c; --t-trap: #e57a72; --t-party: #3987e5; --t-foe: #e57a72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; margin: 0; }
main { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 34px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5vw, 2.7rem); }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; max-width: 72ch; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--brass); }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.head { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 22px; }
.lead { font-size: 1.12rem; max-width: 70ch; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.86rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; }
#curves svg { max-width: 600px; }
#marginal svg { max-width: 720px; }
svg text { font-family: var(--font-body); fill: var(--muted); font-size: 12px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .axis { stroke: var(--muted); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 0.82rem; box-shadow: 0 4px 14px rgb(0 0 0 / 0.14); z-index: 5; min-width: 170px; }
.tip b { font-family: var(--font-display); font-size: 1rem; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; }
.tip .row span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.tip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
details.tv summary { cursor: pointer; font-size: 0.86rem; color: var(--muted); }
table.data { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.data th, table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.data th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
table.data td.n, table.data th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.cellbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.cellbar .b { height: 8px; border-radius: 0 4px 4px 0; background: var(--accent); }
.cellbar .track { width: 90px; display: flex; }
.pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.room h3 { display: flex; gap: 8px; align-items: baseline; }
.room h3 .k { font-family: var(--font-mono); font-size: 0.85rem; color: var(--brass); }
.mini { display: grid; gap: 2px; width: 100%; }
.mini i { aspect-ratio: 1; border-radius: 2px; background: var(--surface-2); display: grid; place-items: center; font-style: normal; font-size: 0.6rem; font-weight: 700; color: #fff; }
.mini i.w { background: var(--t-wall); } .mini i.o { background: var(--t-pit); } .mini i.r { background: var(--t-rough); }
.mini i.d { background: var(--t-dark); } .mini i.h { background: var(--t-hot); } .mini i.t { background: var(--surface-2); outline: 2px dashed var(--t-trap); outline-offset: -3px; }
.mini i.a { background: var(--t-party); } .mini i.e { background: var(--t-foe); }
.keyrow { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.8rem; color: var(--muted); }
.keyrow span { display: inline-flex; align-items: center; gap: 5px; }
.keyrow i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 0.86rem; color: var(--muted); }
.stats b { font-family: var(--font-mono); font-weight: 600; color: var(--ink); }
.note { background: var(--surface-2); border-left: 3px solid var(--brass); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.92rem; max-width: 80ch; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-weight: 700; border: 0; background: none; color: var(--muted); padding: 7px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.deaths { display: flex; flex-direction: column; gap: 3px; font-size: 0.82rem; }
.deaths div { display: grid; grid-template-columns: 6.5em 1fr 3em; align-items: center; gap: 6px; }
.deaths .track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.deaths .track span { display: block; height: 100%; background: var(--t-foe); border-radius: 0 3px 3px 0; }
.deaths .v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; max-width: 80ch; }
</style>

<main>
  <header class="head">
    <span class="eyebrow">Bold Brave Beaten · simulation</span>
    <h1>The Gauntlet</h1>
    <div class="pick"><span class="small muted">Mode</span><div class="seg" id="mode" role="group" aria-label="Mode"></div></div>
    <p class="muted" id="modeBlurb"></p>
    <p class="lead" id="lead"></p>
    <p class="small muted" id="meta"></p>
  </header>

  <section>
    <h2 id="curvesTitle"></h2>

    <div class="panels" id="curves"></div>
  </section>

  <section>
    <h2>What each member adds</h2>
    <p class="muted" id="marginalNote"></p>
    <div class="card" id="marginal"></div>
  </section>

  <section>
    <h2>Who does the work</h2>
    <div class="pick"><label for="lineup" class="small muted">Lineup</label><select id="lineup"></select></div>
    <div class="card scroll" id="members"></div>
  </section>

  <section>
    <h2>The rooms</h2>
    <p class="muted" id="roomsNote"></p>
    <div class="keyrow">
      <span><i style="background:var(--t-party)"></i>Party start</span><span><i style="background:var(--t-foe)"></i>Foes</span>
      <span><i style="background:var(--t-wall)"></i>Pillar</span><span><i style="background:var(--t-pit)"></i>Pit</span>
      <span><i style="background:var(--t-rough)"></i>Rough ground</span><span><i style="background:var(--t-dark)"></i>Darkness</span>
      <span><i style="background:var(--t-hot)"></i>Hot coals</span><span><i style="outline:2px dashed var(--t-trap);outline-offset:-2px"></i>Hidden trap</span>
    </div>
    <div class="rooms" id="rooms"></div>
  </section>

  <section>
    <h2>How the gauntlet works</h2>
    <ul class="plain" id="how"></ul>
  </section>
</main>

    const v = xs[i];
    hair.setAttribute('x1', x(v)); hair.setAttribute('x2', x(v)); hair.style.display = '';
    const rows = series.slice().sort((a, b) => b.vals[i] - a.vals[i]).map((s) => `<div class="row"><span><i style="background:${COLOR[s.k]}"></i>${esc(L[s.k].label)}</span><span class="num">${pct(s.vals[i])}</span></div>`).join('');
    const room = reset() ? R[v - 1] : v ? R[v - 1] : null;
    tip.innerHTML = `<b>${room ? `${v}: ${esc(room.name)}` : 'Start'}</b>${room ? `<div class="small muted">${reset() ? 'won by a fresh party' : 'cleared at least this far'}</div>` : ''}${rows}`;
    tip.hidden = false;
    const box = card.getBoundingClientRect(), sb = svgEl.getBoundingClientRect();
    const left = sb.left - box.left + (x(v) / W) * sb.width;
    tip.style.left = Math.min(box.width - tip.offsetWidth - 8, Math.max(8, left + 12)) + 'px';
    tip.style.top = (sb.top - box.top + 12) + 'px';
  });
  svgEl.querySelector('.hit').addEventListener('pointerleave', () => { tip.hidden = true; hair.style.display = 'none'; });
  return card;
}

function marginalChart(D, L, scoreName) {
  const rows = Object.entries(D.marginal).sort((a, b) => b[1].mean - a[1].mean);
  const W = 640, rowH = 34, m = { l: 150, r: 30, t: 10, b: 34 };
  const H = m.t + m.b + rows.length * rowH;
  const lo = Math.min(-0.5, ...rows.map(([, v]) => v.mean - 1.96 * v.se)), hi = Math.max(0.5, ...rows.map(([, v]) => v.mean + 1.96 * v.se));
  const x = (v) => m.l + ((v - lo) / (hi - lo)) * (W - m.l - m.r);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="What each member adds, with 95% intervals">`;
  const step = hi - lo > 4 ? 1 : 0.5;
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) svg += `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H - m.b}"/><text x="${x(v)}" y="${H - 14}" text-anchor="middle">${v > 0 ? '+' : ''}${+v.toFixed(1)}</text>`;
  svg += `<line x1="${x(0)}" x2="${x(0)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink)" stroke-width="1.5"/>`;
  rows.forEach(([k, v], i) => {
    const cy = m.t + i * rowH + rowH / 2;
    svg += `<g class="mrow" data-k="${k}"><rect x="0" y="${cy - rowH / 2}" width="${W}" height="${rowH}" fill="transparent"/>`;
    svg += `<text x="${m.l - 10}" y="${cy + 4}" text-anchor="end" style="fill:var(--ink);font-weight:600">${esc(short(k))}</text>`;
    svg += `<line x1="${x(v.mean - 1.96 * v.se)}" x2="${x(v.mean + 1.96 * v.se)}" y1="${cy}" y2="${cy}" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>`;
    svg += `<circle cx="${x(v.mean)}" cy="${cy}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></g>`;
  });
  svg += `<text x="${(m.l + W - m.r) / 2}" y="${H - 1}" text-anchor="middle">${esc(scoreName[0].toUpperCase() + scoreName.slice(1))}, with minus without</text></svg>`;
  const card = $('marginal');
  card.innerHTML = svg + `<details class="tv"><summary>Table</summary><div class="scroll"><table class="data"><thead><tr><th>Member</th><th>Compared</th><th class="n">Difference</th><th class="n">95% interval</th></tr></thead><tbody>
    ${rows.map(([k, v]) => `<tr><td>${esc(M[k].label)}</td><td>${esc(L[v.with].label)} vs ${esc(L[v.without].label.toLowerCase())}</td><td class="n">${v.mean >= 0 ? '+' : ''}${v.mean.toFixed(2)}</td><td class="n">${(v.mean - 1.96 * v.se).toFixed(2)} to ${(v.mean + 1.96 * v.se).toFixed(2)}</td></tr>`).join('')}</tbody></table></div></details>`;
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.hidden = true; card.appendChild(tip);
  card.querySelectorAll('.mrow').forEach((g) => {
    g.addEventListener('pointermove', (e) => {
      const v = D.marginal[g.dataset.k];
      tip.innerHTML = `<b>${esc(M[g.dataset.k].label)}</b><div class="row"><span>${esc(L[v.with].label)}</span><span class="num">${L[v.with].meanCleared.toFixed(2)}</span></div><div class="row"><span>${esc(L[v.without].label)}</span><span class="num">${L[v.without].meanCleared.toFixed(2)}</span></div><div class="row"><span>Difference</span><span class="num">${v.mean >= 0 ? '+' : ''}${v.mean.toFixed(2)} ± ${(1.96 * v.se).toFixed(2)}</span></div>`;
      tip.hidden = false;
      const box = card.getBoundingClientRect();
      tip.style.left = Math.min(box.width - tip.offsetWidth - 8, e.clientX - box.left + 14) + 'px';
      tip.style.top = (e.clientY - box.top + 14) + 'px';
    });
    g.addEventListener('pointerleave', () => { tip.hidden = true; });
  });
}

const TILE_CLASS = { '#': 'w', O: 'o', ':': 'r', D: 'd', '^': 'h', F: 't', P: 't', A: 'a', E: 'e' };
function drawLineup() {
  const D = DATA.modes[mode], l = D.lineups[cur];
  const ms = Object.entries(l.memberStats);
  const maxShare = Math.max(...ms.map(([, s]) => s.shareAttrs), 0.01);
  const bar = (v, max) => `<div class="cellbar"><span class="num">${pct(v)}</span><span class="track"><span class="b" style="width:${(v / max) * 100}%"></span></span></div>`;
  $('members').innerHTML = `<table class="data"><thead><tr><th>Member</th><th class="n">Share of wounds dealt</th><th class="n">Foes downed</th><th class="n">Wounds dealt</th><th class="n">Stamina dealt</th><th class="n">Wounds taken</th><th class="n">${reset() ? 'Deaths per run' : 'Dies'}</th><th>Dies most in</th></tr></thead><tbody>
    ${ms.map(([k, s]) => {
      const where = s.diedIn.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0])[0];
      return `<tr><td><b>${esc(short(k))}</b> <span class="small muted">${esc(M[k].label.split(' (')[1] ? '(' + M[k].label.split(' (')[1] : '')}</span></td><td class="n">${bar(s.shareAttrs, maxShare)}</td><td class="n">${s.downs.toFixed(1)} <span class="muted">(${pct(s.shareDowns)})</span></td><td class="n">${s.dealtAttrs.toFixed(1)}</td><td class="n">${s.dealtStamina.toFixed(1)}</td><td class="n">${s.takenAttrs.toFixed(1)}</td><td class="n">${reset() ? s.deathRate.toFixed(2) : pct(s.deathRate)}</td><td>${where[0] > 0 ? esc(R[where[1]].name) : '—'}</td></tr>`;
    }).join('')}</tbody></table>
    <p class="small muted">Per run${reset() ? ' (eight fights, each with a fresh party)' : ''}. Wounds are attribute points (mostly CON) from blows and spells; bleeding, poison and hazards aren't credited to anyone. A foe is credited to whoever landed the blow that dropped it.</p>`;
  $('rooms').innerHTML = R.map((room, i) => {
    const s = l.roomStats[i];
    const w = room.map[0].length;
    const cellsHtml = room.map.join('').split('').map((ch) => `<i class="${TILE_CLASS[ch] || ''}"></i>`).join('');
    const deaths = s.reached ? `<div class="deaths" aria-label="Who dies here">${l.members.map((m) => `<div><span>${esc(short(m))}</span><span class="track"><span style="width:${(s.memberDeaths[m] || 0) * 100}%"></span></span><span class="v">${pct(s.memberDeaths[m])}</span></div>`).join('')}</div>` : '';
    return `<div class="card room"><h3><span class="k">${i + 1}</span>${esc(room.name)}${!reset() && i === DATA.campAfter ? ' <span class="small muted" style="font-family:var(--font-body);font-weight:500">after camp</span>' : ''}</h3>
      <div class="mini" style="grid-template-columns:repeat(${w},1fr)" role="img" aria-label="Map of ${esc(room.name)}">${cellsHtml}</div>
      <p class="small">${esc(room.blurb)} <span class="muted">${esc(room.foeNames.join(', '))}.</span></p>
      <div class="stats">${reset() ? '' : `<span>Reached <b>${pct(s.reached / DATA.n)}</b></span>`}<span>Won ${reset() ? '' : 'there '}<b>${s.reached ? pct(s.cleared / s.reached) : '—'}</b></span><span>Rounds <b>${s.rounds == null ? '—' : s.rounds.toFixed(1)}</b></span></div>
      ${deaths ? `<span class="small muted">Who dies here${reset() ? '' : ' (of runs that got here)'}</span>${deaths}` : ''}</div>`;
  }).join('');
}

function render() {
  const D = DATA.modes[mode], L = D.lineups;
  $('mode').innerHTML = Object.entries(DATA.modes).map(([k, v]) => `<button type="button" data-k="${k}" aria-pressed="${k === mode}">${esc(v.label)}</button>`).join('');
  $('mode').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.k; store.set('gauntlet-mode', mode); render(); }));
  $('modeBlurb').textContent = D.blurb;
  const ranked = Object.entries(L).sort((a, b) => b[1].meanCleared - a[1].meanCleared);
  const best = ranked[0][1], worst = ranked[ranked.length - 1][1];
  if (reset()) {
    const hardest = R.map((r, i) => [r, Math.max(...Object.values(L).map((l) => l.winRate[i]))]).sort((a, b) => a[1] - b[1])[0];
    $('lead').textContent = `At full strength, ${best.label.toLowerCase().replace(/^\+ /, 'the trio plus the ')} wins ${best.meanCleared.toFixed(1)} of ${R.length} rooms on average; ${worst.label.toLowerCase()} wins ${worst.meanCleared.toFixed(1)}. The hardest room is ${hardest[0].name}: the best lineup wins it ${pct(hardest[1])} of the time.`;
  } else {
    const furthest = Math.max(...Object.values(L).map((l) => l.clear.findLastIndex((x) => x > 0) + 1));
    $('lead').textContent = `${best.label} gets furthest, clearing ${best.meanCleared.toFixed(1)} of ${R.length} rooms on average; ${worst.label.toLowerCase()} clears ${worst.meanCleared.toFixed(1)}. ` +
      (best.fullClear > 0 ? `${pct(best.fullClear)} of its runs clear every room.` : `No run has cleared all eight; the deepest any run got was room ${Math.min(furthest + 1, R.length)}, ${R[Math.min(furthest, R.length - 1)].name}.`);
  }
  $('meta').textContent = `${DATA.n} runs per lineup per mode, the same seeds for every lineup · ${DATA.seconds} s · generated ${DATA.generated.slice(0, 10)}`;
  $('curvesTitle').textContent = reset() ? 'How each room goes at full strength' : 'How far each party gets';
  $('curvesNote').textContent = reset() ? 'Win rate in each room for a fresh, full-strength party.' : `Share of runs that cleared at least this many rooms. The party camps (a long rest) after room ${DATA.campAfter}.`;
  $('curves').innerHTML = '';
  const fourth = ['core', 'mage', 'enchanter', 'cleric', 'grappler', 'duelist'].filter((k) => L[k]);
  const ablate = ['mage', 'noKnight', 'noTwoHander', 'noArcher'].filter((k) => L[k]);
  if (fourth.length) $('curves').appendChild(curveChart('Who fills the fourth slot', fourth, 'core', L));
  if (ablate.length > 1) $('curves').appendChild(curveChart('The mage party, one member short', ablate, null, L));
  $('marginalNote').textContent = `${D.score[0].toUpperCase() + D.score.slice(1)} with the member minus without, on the same seeds. Whiskers are 95% intervals. The fourth-slot members are compared with the core trio, and the core members with the mage party minus that member.`;
  marginalChart(D, L, D.score);
  if (!cur || !L[cur]) cur = L[store.get('gauntlet-lineup')] ? store.get('gauntlet-lineup') : L.mage ? 'mage' : Object.keys(L)[0];
  $('lineup').innerHTML = Object.entries(L).map(([k, l]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(l.label)}</option>`).join('');
  $('roomsNote').textContent = reset() ? 'In order. The numbers are for the lineup chosen above, fighting each room fresh.' : 'In order. The numbers are for the lineup chosen above: how often it got this far, and how it did once there.';
  drawLineup();
}
$('lineup').addEventListener('change', (e) => { cur = e.target.value; store.set('gauntlet-lineup', cur); drawLineup(); });
render();

$('how').innerHTML = [
  'A party of level-5 adventurers (the arena builds) fights the eight rooms in order. A room is lost if the party is wiped out or can\'t win within 30 rounds.',
  `Attrition mode: the same party goes on from room to room. Between rooms there is a breather: stamina comes back and the unconscious get up; wounds (CON), spell points, arrows and battered shields carry on. Each member has one bandage, used on whoever is bleeding while they last; untended bleeding runs its course. After room ${DATA.campAfter} the party makes camp: the long-rest rules (bleeding tended, stamina and spell points back, one daily heal roll, some armor repair). The run ends at the first room lost.`,
  'Reset mode: every room is fought by a fresh, full-strength party, the dead restored, so every room is tested in every run. Deaths are still recorded room by room.',
  'Traps are hidden runes laid by the foes\' side: the foes know where they are and the party does not. There is no way to search for them yet.',
  'The rooms are ordered by how hard each fight was for a fresh party in the party arena, from goblins up to the troll chieftain.',
  'Every lineup runs the same seeds, so comparisons between lineups are paired; a member\'s value is the mean paired difference in the mode\'s score.',
  'Raw data: runs.csv has one row per mode, run and member (score, deaths and the rooms they happened in, wounds dealt and taken, foes downed), for R.',
].map((t) => `<li>${esc(t)}</li>`).join('');
</script>
