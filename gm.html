<script>
  // The GM table needs the YAML content before it starts.
  BBB.Content.load('data/').then(function (res) {
    if (!res.ok) { document.getElementById('app').textContent = 'The data did not load: ' + res.errors.join('; '); return; }
    var s = document.createElement('script');
    s.src = 'src/ui/app.js';
    document.body.appendChild(s);
  });
</script>
