# Armor types. mit = mitigation per damage face (P pierce, S slash, B blunt) at full coverage.
# spd/dex = penalty to SPD and DEX; stamina = extra stamina per action; regen = stamina regeneration penalty;
# standUp = extra AP to rise from prone. natural: true marks monster hides (cannot be worn or looted).
# recoil: attackers lose this much stamina per blow that lands.
# material: what a blade meets (CONFIG.materialHardness): metal wears a weapon fast, cloth and leather barely.

padded:
  name: Padded
  material: cloth
  mit: {P: 1, S: 1, B: 3}
  spd: 0
  dex: 0
  stamina: 0
  regen: 1
  standUp: 0
  rarity: common
