mail:
  name: Mail
  pieces: {head: coif, torso: mail shirt, arms: mail sleeves, hands: mail mittens, legs: chausses, feet: mail sabatons}
  material: iron
  materials: [bronze, iron, steel, starIron, adamant]
  mit: {P: 1, S: 4, B: 1}
  spd: 1
  dex: 1
  stamina: 1
  regen: 2
  standUp: 1
  weight: 12
  durability: 40
  pierce: {resist: 1.3, gap: 10}   # TUNED (V4, sim/FINDINGS.md): a longsword thrust bursts iron mail; a rapier doesn't
  transmit: 1.5
  rarity: uncommon
plate:
