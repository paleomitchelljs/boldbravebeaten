# Armor types. Worn armor comes in four tiers: padded, leather (or hide), mail and plate. An item is a type plus
# a material (materials.yaml), an origin (origins.yaml), a craft (crafts.yaml), enchantments (usually none) and a
# coverage (full, half, partial). Figures here are for the type's usual material, common origin, full coverage.
#   mit         mitigation per damage face (P pierce, S slash, B blunt); material and origin scale P and S
#   spd, dex    penalty to SPD and DEX; stamina = extra stamina per action; regen = stamina regeneration penalty;
#               standUp = extra AP to rise from prone. Material and origin weight scale all four penalties.
#   weight      kg, for show (the penalties carry the weight in play)
#   durability  base durability (× material toughness, origin, craft, coverage)
#   material    the usual material; materials = what else it may be made of
#   pierce      what a point must beat (CONFIG.pierce): resist = the punch that bursts through it (× material and
#               origin protect); gap = the target number to find a gap instead (d10 + ⌊DEX/4⌋ + feats)
#   dissipate   share of the blunt left after mitigation that the armor spreads away instead of passing to
#               stamina (rounded down; less as it wears): glancing = cuts and points (converted cuts, turned
#               points), crushing = blows that are mainly blunt (maces, hammers, clubs, fists). Plate: rigid shells
#               over padding spread a blow they turn; a crushing blow still carries (set crushing above 0 to
#               spread it too, at the cost of the mace's place against plate: sim/FINDINGS.md).
#   natural     true marks monster hides (cannot be worn or looted); recoil: attackers lose this much stamina per
#               blow that lands

