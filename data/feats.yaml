# Feat trees. A feat has ranks (novice to master), requires (a list of alternatives; each alternative is a list of
# "feat:rank" that must all hold), an effect line, and auto: true when the engine implements it
# (auto: false feats are recorded on the sheet but have no effect yet). A feat that is only a number declares it in
# `effects`, per rank, with the keys monsters' traits and gear use (src/rules/effects.js): `effects: {dodge: 1}` is
# +1 to dodge at each rank. Feats that are their own maneuver are written in the rules code.

- id: conditioning
  name: Conditioning
  attrs: attributes
  feats:
    strength:
      name: Strength
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 STR per rank"
      auto: true
      attr: STR
    toughness:
      name: Toughness
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 CON per rank"
      auto: true
      attr: CON
    agility:
      name: Agility
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 DEX per rank"
      auto: true
      attr: DEX
    quickness:
      name: Quickness
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 SPD per rank"
      auto: true
      attr: SPD
    intellect:
      name: Intellect
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 INT per rank"
      auto: true
      attr: INT
    resolve:
      name: Resolve
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 WIL per rank"
      auto: true
      attr: WIL
    insight:
      name: Insight
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 WIS per rank"
      auto: true
      attr: WIS
    presence:
      name: Presence
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 CHA per rank"
      auto: true
      attr: CHA
