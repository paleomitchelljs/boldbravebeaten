# Feat trees. A tree has a `group` (the setting it serves: body, combat, sneaking, talking, exploring, magic), a `skill`
# (skills.yaml) that unlocks its feats: a feat's tier needs that many ranks in it (rules.yaml skills.tiers; a tree
# with no skill counts feats held in it instead, as before), and
# `branches` [{id, name, blurb, skill}]: the paths through it, drawn as columns on the training screen; a branch's
# `skill` replaces the tree's for its feats. A requirement "skill:melee:4" asks for Melee 4.
# Feats give large benefits; numbers come from skills (the user, 2026-11-07). Feats that were only a number (Parry,
# Shield and Dodge Training, Read Attack, Misdirection, Grappler, Keen Eye, Stealth, Lockpicking, Trap Craft, Brute
# Force, Liar, Herbalism, Intimidate, Casting) are gone into their skills (rules.yaml skills.retired). A feat names its
# `branch` (none: the tree's root, open to all); `capstone: true` marks a branch's last feat, and a character may hold
# only one capstone in a tree (taking it closes the others). A feat has ranks (the tier each rank needs, novice to
# master), requires (a list of groups, all of which must hold; within a group, any one "feat:rank" will do), an effect
# line, and auto: true when the engine implements it (auto: false feats are recorded on the sheet but have no effect yet). A feat that is only a number declares it in
# `effects`, per rank, with the keys monsters' traits and gear use (src/rules/effects.js): `effects: {dodge: 1}` is
# +1 to dodge at each rank. Feats that are their own maneuver are written in the rules code.

- id: conditioning
  name: Conditioning
  attrs: attributes
  group: body
  branches:
    - {id: body, name: "Body", blurb: "Strength, toughness, agility and speed."}
    - {id: mind, name: "Mind", blurb: "Intellect, resolve, insight and presence."}
  feats:
    strength:
      name: Strength
      branch: body
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 STR per rank"
      auto: true
      attr: STR
    toughness:
      name: Toughness
      branch: body
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 CON per rank"
      auto: true
      attr: CON
    agility:
      name: Agility
      branch: body
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 DEX per rank"
      auto: true
      attr: DEX
    quickness:
      name: Quickness
      branch: body
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 SPD per rank"
      auto: true
      attr: SPD
    intellect:
      name: Intellect
      branch: mind
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 INT per rank"
      auto: true
      attr: INT
    resolve:
      name: Resolve
      branch: mind
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 WIL per rank"
      auto: true
      attr: WIL
    insight:
      name: Insight
      branch: mind
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 WIS per rank"
      auto: true
      attr: WIS
    presence:
      name: Presence
      branch: mind
      ranks: [novice, apprentice, adept]
      requires: []
      effect: "+1 CHA per rank"
      auto: true
      attr: CHA
