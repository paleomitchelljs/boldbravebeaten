# People you can talk to (parley). Reading list:
#   attrs        WIS/WIL/CHA/INT used when they resist your moves.
#   disposition  how much they like you at first (-5..5), before standing and reputation.
#   willingness  how much they will do for a stranger (0..10). Each topic has a `need`.
#   courage      resists intimidation (target number = 5 + courage).   patience: moves they tolerate.
#   temperament  how they read your reputation:
#                  loyal (their faction's standing counts double), venal (gold talks; reputation doesn't),
#                  moral (renown helps, notoriety hurts), fearful (notoriety makes them yield),
#                  starstruck (renown makes them yield), provincial (distrust strangers).
#   interests    tags used by the Appeal move: a topic with a matching tag is easier.
# Topics: need = willingness required. kind info | quest | favor | trade | pass.
#   requires/hide: a condition (see src/game/conditions.js).   once: can only be taken once.
#   gives {gold, xp, good, flag} / sets [flags] / starts: quest id / standing {faction: n} / renown: n / notoriety: n
#   tag: matches the Appeal move.   lie: true topics can be Bluffed (+2 willingness once).

marta_quill:
  name: Marta Quill
  title: Innkeeper of the Tilted Cask
  faction: merchants_guild
  sprite: wizard
  glyph: "🍺"
  look: A broad woman with ink on her cuffs from keeping everyone's tab.
  attrs: {WIS: 7, WIL: 5, CHA: 6, INT: 6}
  disposition: 1
  willingness: 3
  courage: 4
  patience: 6
  temperament: [venal]
  interests: [business, quiet]
  greeting: "Sit, sit. Ale's fair and the beds are dry. What can I do for you?"
  topics:
    - {id: rumors, label: "What's the talk in town?", need: 1, kind: info, text: "Smuggled goods are turning up again. The Watch blames the cellars under the old mill; the Guild blames the Watch. The wolves are bolder this winter, too."}
    - {id: mill, label: "What do you know about the old mill?", need: 3, kind: info, tag: business, sets: [knows_mill], text: "It burned years ago. But there's a cellar door round the back that's oiled. Somebody walks in and out of there at night, and they don't pay the toll at the gate."}
    - {id: who, label: "Who matters in Stonebridge?", need: 2, kind: info, sets: [knows_factions], text: "Captain Hollis keeps the peace, Pell keeps the ledgers, and Ysa at the Lantern keeps the dead from becoming a nuisance. Cross one and the others hear by supper."}
    - {id: tab, label: "Could you put a room on a tab?", need: 6, kind: favor, once: true, tag: business, sets: [inn_tab], text: "For someone I trust? Rooms are half price. Pay me back with interest, and don't make me regret it."}

captain_hollis:
  name: Captain Hollis
  title: Captain of the Watch
  faction: town_watch
  sprite: knight
  glyph: "🛡"
  look: Grey at the temples, mail polished, a scar through one eyebrow.
  attrs: {WIS: 7, WIL: 7, CHA: 5, INT: 5}
  disposition: 0
  willingness: 2
  courage: 7
  patience: 4
  temperament: [loyal, moral]
  interests: [order, safety]
  greeting: "State your business. I've a gate to run."
  topics:
    - {id: gate, label: "Can I come and go after dark?", need: 7, kind: pass, once: true, tag: order, sets: [gate_pass], text: "You've earned a lantern at the gate. Don't make me sorry."}
    - {id: bounty, label: "Is there a bounty on anything?", need: 3, kind: info, requires: {standing: {faction: town_watch, min: 10}}, text: "Cutthroats in the cellar: two crowns each. Bring a name, not a body."}

guildmaster_pell:
  name: Guildmaster Pell
  title: Master of the Merchants' Guild
  faction: merchants_guild
  sprite: wizard
  glyph: "⚖"
  look: Neat, soft-spoken, with rings he never takes off.
  attrs: {WIS: 8, WIL: 6, CHA: 7, INT: 8}
  disposition: 0
  willingness: 2
  courage: 5
  patience: 5
  temperament: [venal]
  interests: [business, profit]
  greeting: "Everything has a price. Let us find out what yours is."
  topics:
    - {id: stock, label: "Is there better stock than the market shows?", need: 6, kind: favor, once: true, tag: profit, sets: [guild_stock], text: "For friends: yes. I'll open the back room for you at the smith's and the market."}

warden_ysa:
  name: Warden Ysa
  title: Warden of the Lantern
  faction: lantern_order
  sprite: wizard
  glyph: "🏮"
  look: Calm, tall, a lamp-wick behind one ear for luck. Her robe is stained at the cuffs.
  attrs: {WIS: 8, WIL: 8, CHA: 6, INT: 7}
  disposition: 1
  willingness: 3
  courage: 8
  patience: 6
  temperament: [moral]
  interests: [mercy, rest]
  greeting: "Light and quiet to you. Are you hurt, or just tired?"
  topics:
    - {id: rites, label: "Will you teach me the old rites?", need: 8, kind: favor, once: true, tag: mercy, gives: {good: tome_still}, text: "These words were written for the keepers of the lamp. You are not a keeper. But you listen. Take it."}

brannock:
  name: Brannock
  title: Smith
  faction: merchants_guild
  sprite: knight
  glyph: "🔨"
  look: Forearms like cordwood, a leather apron burned black along the front.
  attrs: {WIS: 5, WIL: 7, CHA: 4, INT: 6}
  disposition: 0
  willingness: 2
  courage: 7
  patience: 4
  temperament: [moral]
  interests: [craft, honest work]
  greeting: "Armor, blades, or a dent you can't hammer out yourself?"
  topics:
    - {id: steel, label: "What makes armor worth wearing?", need: 1, kind: info, text: "Plate stops nearly everything and is worth a king's ransom. Mail turns a blade. Leather and padding turn a bad day into a bruise. Most folk die in whatever they could afford."}
    - {id: weak, label: "What kills a man in plate?", need: 4, kind: info, tag: craft, text: "A hammer. Or a man who gets his arms around you and puts you in the mud. Or waiting for him to wear himself out. Heavy armor tires you."}
    - {id: discount, label: "Anything for a regular?", need: 5, kind: favor, once: true, tag: craft, sets: [smith_discount], text: "Bring me a coin and honest work and I'll take a tenth off. Don't haggle after."}

wren_urchin:
  name: Wren
  title: Gate-runner
  faction: ~
  sprite: rogue
  glyph: "🧣"
  look: Twelve or so, quick-eyed, knows every wall in town that can be climbed.
  attrs: {WIS: 6, WIL: 3, CHA: 5, INT: 5}
  disposition: 0
  willingness: 3
  courage: 2
  patience: 4
  temperament: [venal, fearful]
  interests: [coin, safety]
  greeting: "Got a coin? I've got a map in my head."
  topics:

old_dagmar:
  name: Old Dagmar
  title: Retired sergeant
  faction: town_watch
  sprite: wizard
  glyph: "🍺"
  look: Missing two fingers, most of his hearing and none of his opinions.
  attrs: {WIS: 5, WIL: 5, CHA: 5, INT: 5}
  disposition: 1
  willingness: 4
  courage: 3
  patience: 5
  temperament: [starstruck, fearful]
  interests: [old days, drink]
  greeting: "Pull up a chair, lad. I've seen things."
  topics:
    - {id: wolves, label: "How do you handle wolves?", need: 1, kind: info, text: "Back to a wall and keep a shield up. Never fight in the open; they go around you."}
    - {id: sleeve, label: "Do you have anything left from the old days?", need: 7, kind: favor, once: true, gives: {good: charm_wolf}, text: "Here. Wore it a dozen winters. Keeps the cold out of your thinking."}

sly_corvin:
  name: Corvin
  title: A man who knows men
  faction: cutthroats
  sprite: rogue
  glyph: "🗝"
  look: Dark coat, soft boots, a smile that stops at the cheeks.
  attrs: {WIS: 7, WIL: 6, CHA: 6, INT: 7}
  disposition: -1
  willingness: 1
  courage: 6
  patience: 4
  temperament: [provincial, loyal]
  interests: [coin, discretion]
  greeting: "Sit. Don't stare. Everyone's watching, so smile."
  topics:

# ---- The fire-goblin mine: the gnomes of the cut-off fort ----
gnome_sergeant:
  name: Sergeant Brask
  title: Leader of a gnome patrol
  faction: deep_gnomes
  sprite: {art: gnome-miner, kind: knight, scale: 0.7}
  glyph: "🧔"
  look: A gnome in soot-black mail, a hammer on his shoulder and a lamp on his helm, very sure you are a goblin trick.
  attrs: {WIS: 7, WIL: 7, CHA: 5, INT: 7}
  disposition: -1
  willingness: 2
  courage: 7
  patience: 5
  temperament: [loyal, provincial]
  interests: [goblins, surface, mining]
  greeting: "Not one step more. Who sent you down here, and how did you get past the stair?"
  topics:
    - {id: who, label: "Who are you?", need: 1, kind: info, text: "The fort's patrol. We hold the bridge and the tunnels either side of it, and the goblins hold the rest. We've held it a long time."}
    - {id: goblins, label: "We're no friends of the goblins.", need: 3, kind: pass, tag: goblins, sets: [gnomes_trust], standing: {deep_gnomes: 5}, text: "No, you're not, are you. Goblins don't bleed like that. Go on over. Tell the Warden I let you by."}
    - {id: surface, label: "We came down from the surface.", need: 4, kind: info, tag: surface, text: "From up top? Then the stair's open again. The Warden will want to hear that from your own mouths."}
gnome_eastwatch:
  name: Watchman Tibb
  title: The east gate's watch
  faction: deep_gnomes
  sprite: {art: gnome-miner, kind: knight, scale: 0.7}
  glyph: "🧔"
  look: A gnome in a crossbowman's leather coat, the bolt never quite off you, a burn scar down one side of his face.
  attrs: {WIS: 8, WIL: 6, CHA: 4, INT: 7}
  disposition: -1
  willingness: 2
  courage: 6
  patience: 4
  temperament: [wary, dry]
  interests: [goblins, surface, mining]
  greeting: "Stop there. Nothing good has ever come down that tunnel. What are you, and how did you get through their guard post?"
  topics:
    - {id: who, label: "Who are you?", need: 1, kind: info, text: "The east gate's watch. Their guard post is at the other end of that tunnel. They come down it two or three times a month, and they go back up it fewer."}
    - {id: goblins, label: "We're no friends of the goblins.", need: 3, kind: pass, tag: goblins, sets: [gnomes_trust], standing: {deep_gnomes: 5}, text: "No. You've their blood on you, not their paint. Come in, then, quick, before the gate's open long enough to be noticed. The Warden is in the east hall."}
    - {id: surface, label: "We came down from the surface.", need: 4, kind: info, tag: surface, text: "Through all of that? Then there's more of a way up than we thought. Tell the Warden. That's news worth hearing twice."}
gnome_warden:
  name: Warden Odda
  title: Warden of the gnome fort
  faction: deep_gnomes
  sprite: {art: gnome-surveyor, kind: wizard, scale: 0.7}
  glyph: "🧔"
  look: An old gnome with burn scars up both arms and a map of the mine inked on the back of one hand.
  attrs: {WIS: 9, WIL: 8, CHA: 7, INT: 9}
  disposition: 1
  willingness: 3
  courage: 8
  patience: 6
  temperament: [loyal, moral]
  interests: [goblins, surface, mining]
  greeting: "Sit. Brask says you came down the stair. Nobody has come down the stair in eleven years."
  topics:
    - {id: fort, label: "How long have you been cut off?", need: 1, kind: info, text: "Eleven years. The goblins took the hall and the stair, and we took the far side of the chasm and walled it. We mine, we eat what grows in the warm caves, and we bury our dead in the rock."}
    - {id: king, label: "What would it take to free you?", need: 3, kind: quest, starts: ember_king, hide: {quest: ember_king}, tag: goblins, text: "Their king. While he sits on that throne the goblins hold together. Kill him, and they'll fall to fighting over the chair, and we can walk out up the stair."}
    - {id: secret, label: "Is there another way into their castle?", need: 5, kind: info, tag: mining, sets: [knows_castle_seam], text: "There is. Their baron sits in the far south-west of the caves, and the rock behind his throne is a goblin door. It comes out inside their portcullis. And inside, in the southern warrens, there's a passage that seems to end in nothing. It ends in another such door, into the king's own rooms."}
    - {id: pit, label: "What is in the warrens?", need: 4, kind: info, tag: mining, text: "A drake that eats goblins, and anything else it finds. And mind the floor on the way to the barracks: there's a stretch of it laid over a pit, and what lives in the pit is worse than the drake."}
    - {id: kingdead, label: "The goblin king is dead.", need: 1, kind: info, once: true, requires: {flag: ember_king_dead}, sets: [told_odda_king], text: "Then it's done. Listen: you can hear them already, fighting over the chair. We'll go up the stair when they're through. You'll always have a door here."}
    - {id: prisoner, label: "Your Fennick is alive. He's free.", need: 2, kind: favor, once: true, requires: {flag: freed_fennick}, gives: {gold: 60, xp: 80}, standing: {deep_gnomes: 15}, text: "Fennick! We said the words for him two winters ago. Take this, it's what we have. And our thanks, which is worth more down here."}
gnome_prisoner:
  name: Fennick
  title: A gnome in the goblins' jail
  faction: deep_gnomes
  sprite: {art: gnome-miner, kind: wizard, scale: 0.7}
  glyph: "🧔"
  look: A thin gnome in a cage, chained at the ankle, who has been asked the same questions for two years.
  attrs: {WIS: 6, WIL: 9, CHA: 5, INT: 8}
  disposition: 2
  willingness: 4
  courage: 9
  patience: 6
  temperament: [loyal]
  interests: [goblins, surface]
  greeting: "You're not goblins. Are you real? Say something a goblin wouldn't."
  topics:
    - {id: free, label: "We'll get you out. Go to the fort.", need: 2, kind: favor, once: true, sets: [freed_fennick], standing: {deep_gnomes: 5}, text: "I know the way in the dark. Tell the Warden it was Fennick that didn't talk."}
    - {id: deep, label: "Where does the stair beyond go?", need: 3, kind: info, text: "Down, to where the drake's mother sleeps. The goblins feed her their prisoners. They were saving me for it."}
