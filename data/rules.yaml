# Rule numbers kept with the content: anything here is merged over src/rules/config.js (deep merge),
# so a tuned value can live beside the files it affects. Keys under `game` are read by the game layer.

# Gear rolled for template foes (foes.yaml), by level band (levels 1–2, 3–5, 6+): weighted [weight, id] lists.
# metal: the material of metal armor and metal-bladed weapons; origin: armor and weapons. Exotic materials and
# enchantments are never rolled: they are placed by hand.
enemyGear:
  craft: [[[3, poor], [7, average]], [[1, poor], [8, average], [1, master]], [[6, average], [3, master]]]
  metal: [[[2, bronze], [3, iron]], [[1, bronze], [4, iron], [1, steel]], [[3, iron], [3, steel]]]
  origin: [[[1, common]], [[18, common], [1, elven], [1, dwarven]], [[8, common], [1, elven], [1, dwarven]]]

# ---- The contest (PROVISIONAL, docs/OVERHAUL.md step A) -------------------------------------------------------
# One opposed roll decides a blow: the attacker's d10 + strike bonus against the defender's d10 + defence bonus
# (Combat.defenseNumbers). Its margin (the attacker's total less the defender's) is what the blow does with the armor
# and the body: whether a point gets through (CONFIG.pierce.perMargin), whether the wound is vital (locations.wounds
# .vital), whether an unaimed blow finds the worst-guarded place beside where it fell (shift). Ties go to the defender.
# A blow nobody defends always lands, and its margin is the attacker's d10 + strike bonus less `passive`, by what the
# target can do about it: ready (standing, free, aware; out of AP or choosing not to defend), unaware (not seeing the
# blow, or caught off guard), prone, held (held or pinned), down (collapsed or unconscious).
contest:
  passive: {ready: 6, unaware: 3, prone: 3, held: 2, down: 0}
  shift: 6

# ---- Hit locations (PROVISIONAL, the user's choice: docs/PROPOSALS.md §2, step 1; four since step A) -------------
# A body is four locations, which are also the four armor slots. An armor piece `covers` some of them (an item without
# `covers` reads its coverage keyword below). share: the part of the body each is, so the part of the blows an
# unaimed blow lands there, and the part of a type's weight, penalties and durability a piece covering it carries
# (a full harness sums to 1, so it plays as one piece always did). The arms take in the hands and the legs the feet.
# next: the places beside each. An unaimed blow whose margin is `contest.shift` or more lands on the worst-guarded of
# its place and the places beside it (a gap found); a cut that gets through a place in `carry.from` (bare, or cutting
# through cloth or leather) carries the slashing beyond `carry.limb` into the worst-guarded place beside it, where
# that place's armor meets it.
locations:
  order: [head, torso, arms, legs]
  names: {head: Head, torso: Torso, arms: Arms, legs: Legs}
  share: {head: 0.08, torso: 0.40, arms: 0.23, legs: 0.29}
  coverage: {full: [head, torso, arms, legs], half: [torso, arms, legs], partial: [torso], halfHead: [head, torso, arms, legs], partialHead: [head, torso]}
  # halfHead, partialHead: PROVISIONAL (docs/PLAN.md R7, step 4): half and partial with head cover of the same
  # type (a coif, a cap, a helm), for the foe templates and humanoid monsters that wear armor.
  next: {head: [torso], torso: [arms, head, legs], arms: [torso, head], legs: [legs, torso]}
  # aim: a blow aimed at a location (decl.location; none = unaimed, rolled) lands there if it lands, and pays
  # `penalty` off its contest (a thrust `thrustLess` less: a point is placed more easily); a shield blocks blows aimed
  # at what it covers more easily (+`block`).
  # guarded: PROVISIONAL (docs/PLAN.md R6, step 4): what the aim costs against a defender who can still react
  # (standing, free, aware: Combat.aimGuarded) and defends; small targets are markedly dearer, so the head is
  # something you set up (a knockdown, a hold, an unseen blow, a foe whose AP is spent). `penalty` is the cost against
  # one who can't (prone, collapsed, held, caught off guard, not seeing the blow) or doesn't defend.
  aim:
    penalty: {head: 3, torso: 0, arms: 1, legs: 1}   # head: TUNED (step A) 2 → 3, the head share back under a quarter (sim/duels.js 35% → 21%)
    guarded: {head: 5, torso: 0, arms: 1, legs: 1}
    thrustLess: 1
    shield: {covers: [torso, arms], block: 1}
  # wounds (step 3): what a wound does where it lands.
  #   attrs   what each point of a cut takes, rolled among these (and of a crush, with CONFIG.impact.crushAttrs)
  #   pointToCON  PROVISIONAL (docs/PLAN.md R4): where a point that goes in (piercing) takes CON; elsewhere its points
  #           take the location's attrs, rolled as a cut's, unless the wound is vital (then CON × vital.mult).
  #   tirelessCON PROVISIONAL (step 3): a tireless body (no stamina; undead, constructs) takes every point that reaches
  #           it to CON wherever it lands: it has no strength to lose, only a frame to break.
  #   vital   PROVISIONAL (step A): the margin at or above which a point or a cut that reaches the body there is a
  #           vital wound (null: never), before the armor there, the blow's depth or edge and the body's size
  #           (CONFIG.vital).
  #   effects per point of wound that reached the body there (÷ the target's size): disarm (drops what is in
  #           hand), trip (knocked down); stun: per point of blunt that lands on the head (CON resists, as a spell)
  wounds:
    attrs: {head: [CON, INT, WIL], torso: [CON, STR], arms: [STR, DEX, CON], legs: [SPD, CON]}
    vital: {head: 7, torso: 9, arms: 12, legs: 11}
    pointToCON: [head, torso]
    tirelessCON: true
    effects:
      head: {stun: 0.1}
      arms: {disarm: 0.1}
      legs: {trip: 0.08}
  carry:
    limb: 3
    from: [head, arms, legs]

# ---- Hero mode (the menu's checkbox: testing, and an easy game) ----------------------------------------------------
# Party members and their companions (a character with `hero` set; World.syncHero). dealt and taken multiply each
# blow's damage before armor (a spell's magnitude); regen is added to stamina regeneration each round, and with
# regenWhenHit a hero recovers even in a round they were struck. A hero's CON never falls below 1: a blow that would
# kill knocks them out instead.
hero:
  dealt: 1.5
  taken: 0.5
  regen: 6
  regenWhenHit: true

game:
  # ---- Equipment ----------------------------------------------------------
  # Worn slots (the user's list), after the hands, shield and chest (armor). A worn good's `slot` names one of
  # these ids, or a `takes` (both ring slots take a ring). Add a slot here (a waist, ears) and goods can use it.
  wornSlots:
    - {id: head, name: Head}
    - {id: neck, name: Neck}
    - {id: shoulders, name: Shoulders}
    - {id: cape, name: Cape}
    - {id: waist, name: Waist}
    - {id: ear1, name: Ear, takes: ear}
    - {id: ear2, name: Ear, takes: ear}
    - {id: arms, name: Arms}
    - {id: hands, name: Hands}
    - {id: ring1, name: Ring, takes: ring}
    - {id: ring2, name: Ring, takes: ring}
    - {id: legs, name: Legs}
    - {id: feet, name: Boots}
  # ---- Companions (PROVISIONAL, the user's idea; src/game/companions.js) -------------------------------------
  # Which monsters.yaml creatures answer each feat, by rank (rank II adds the second list). The owner may choose
  # among those on offer; otherwise the last (strongest) is taken. death: attribute points a familiar's death costs.
  companions:
    familiar: {ranks: [[duskBat, rat, faeDrake], [fireSprite]], death: {WIL: 2}}
    beast: {ranks: [[wolf], [alphaWolf]]}
  # ---- Starting a game ----------------------------------------------------
  # size: the most heroes in a party; a new game begins with 1 to size of them (the user, 2026-11-09: 1 to 6).
  party: {size: 6, attrPool: 40, attrMin: 3, attrMax: 8, startGold: 60}
  # ---- Progression --------------------------------------------------------
  # XP needed to reach level n = xpBase * n * (n - 1) / 2 (so 60, 180, 360, 600…).
  xpBase: 60
  # PROVISIONAL (ruling R10, docs/PLAN.md, 2026-11-11): 20, up from 10; the cap is a ceiling on the XP curve (11,400 XP
  # at level 20), not a cap on a build (skills stay 0-10, the cost of the points is the limit). The curve and the XP
  # question are in docs/FEATS-AUDIT.md §5.
  maxLevel: 20
  # Training costs no gold (the user, 2026-11-07): skills and feats are trained whenever the party isn't fighting;
  # levels are the only limit.
  # ---- Time and exploring -------------------------------------------------
  # PROVISIONAL (the user, 2026-10-28): exploring a baseline dungeon (the temple, every area) thoroughly, with no
  # fights, should take close to one waking day (exploreDay minutes), after which the party needs a long rest. A step
  # is 10 seconds (the user's call): careful walking with a torch, looking about. `node tools/pace.js` measures the
  # floor: seeing every square by the shortest greedy route is 1013 steps for the temple (2.8 h); walking every open
  # square is about 4400 (12 h); searches (10 minutes each) and doubling back make up the rest of the day. Sneaking
  # is half the pace. Rerun the tool after a map change.
  exploreDay: 960
  stepSeconds: 10
  sneakStepSeconds: 20
  searchMinutes: 10          # a search covers the 5x5 squares around the party
  # PROVISIONAL: time in a dungeon draws its wanderers (a camp keeps its own roll, camp below). Every `every` minutes
  # spent in a place (walking, searching, picking locks, rituals, the rest after a fight) is a check: on `chance` the
  # place's wandering table is drawn (its `nothing` entries still count). A loud thing adds `noise` minutes to the
  # count at once. The best perception in the party hears them coming (TN `hearTn`); if it fails, the party is caught
  # off guard. A party sneaking makes a group stealth check against the wanderers and lets them pass on a success.
  wanderers:
    every: 20
    chance: 0.35
    hearTn: 8
    noise: {force: 10, fight: 15, trap: 5}
  noticeDistance: 4          # tiles at which an awake group notices an unhidden party
  sleepNoticeDistance: 2     # ...and a sleeping one
  lightRadius: 7
  # The battlefield view, w × h squares. whole: true (the user, 2026-11-01) plays the fight on the whole map, so it can
  # spill into the next room and draw in groups it comes near (joinDistance, checked every round); false, on a slice
  # of the map that size.
  arena: {w: 15, h: 10, whole: true}
  # The exploring view (the user, 2026-11-09: "fix the explore view"): as many squares as the window fits at `cell`
  # px a square (the art's own size), between the bounds; a screen too narrow for minCols at that size shrinks the
  # squares instead and shows more rows. chromeW/chromeH: px of the window the map can't have (gutters; top bar and log); maxW: the page's own width (css .game).
  view: {cell: 64, minCols: 11, maxCols: 21, minRows: 8, maxRows: 16, chromeW: 24, chromeH: 140, maxW: 1150}
  # Standing orders for reactions (docs/PLAN.md step 8, src/game/orders.js): every hero's start. A hero's own c.orders
  # (set on the battle screen or the sheet) override these key by key. PROVISIONAL.
  #   block "on"|"off" (quoted: YAML reads a bare on or off as a boolean) · parry thrusts|all|off · dodge unarmored|always|off · opportunity strike|ask|off
  #   ask matters|every|never: a prompt only for a blow whose chance of dropping the hero, if nothing stops it, is `drop`
  orders: {block: "on", parry: thrusts, dodge: unarmored, opportunity: strike, ask: matters, drop: 0.1}
  joinDistance: 6         # PROVISIONAL: an awake group this close to a fight (with a clear line) joins it
  # ---- Ground (PROVISIONAL, for the temple) ----------------------------------------------------------------------
  # Map letters with the same meaning on every map, besides # wall, . floor, + door and space (rock). A place's
  # look.ground names the letter its plain floor and legend squares stand on (the courtyard is grass); a legend entry
  # may say `on: "<letter>"` for its own square.
  #   walk: false   nobody walks through it (fliers cross; it stops neither sight, missiles nor reach)
  #   wall: true    a wall, drawn with its own tiles
  #   fight         the terrain (CONFIG.terrain) the square becomes in a fight on the map
  #   under         drawn over another letter's ground (a bridge over water)
  #   tile          the terrain of the place's tileset that draws it (data/tilesets.yaml); color without one
  #   rise: true    a riser between terraces (with wall: true, a pyramid's step): drawn as the highest terrain beside
  #                 it, the tier it holds up. A stair through it is a legend prop that is not solid, `on` this letter
  ground:
    ",": {name: Grass, tile: grass, color: "#4a6a34"}
    ";": {name: Rubble, tile: rubble, fight: rough, color: "#7a6a50"}
    "%": {name: Ferns, tile: ferns, color: "#4d6a3a"}
    "~": {name: Deep water, walk: false, fight: deepWater, tile: water, color: "#1f4450"}
    "_": {name: Shallow water, fight: shallows, tile: shallows, color: "#36616a"}
    "=": {name: Plank bridge, under: "~", tile: bridge, color: "#7a5a36"}
    "^": {name: Pyramid step, wall: true, rise: true, color: "#a89468"}
    "-": {name: First terrace, tile: tier1, color: "#bab286"}
    ":": {name: Second terrace, tile: tier2, color: "#bab286"}
    "*": {name: Third terrace, tile: tier3, color: "#bab286"}
    "&": {name: Top terrace, tile: tier4, color: "#bab286"}
    "|": {name: Dais, tile: dais, color: "#c8b67a"}            # a raised platform you walk on (the palace's throne)
    # The fire-goblin mine (assets/ideas/ember-mine.md). Lava: nobody walks in, but a shove or a fall puts you there.
    "$": {name: Lava, walk: false, fight: lava, tile: lava, color: "#c8401a"}
    ")": {name: Stone bridge, under: "$", tile: bridge, color: "#4a4440"}
    "/": {name: Stair, tile: steps, color: "#3a3634"}          # cut steps you walk up or down (a winding stair)
    "]": {name: Jungle, wall: true, tile: jungle, color: "#24381f"}   # the jungle edge round the temple swamp (its own wall)
    "'": {name: Murder hole, walk: false, fight: bars, tile: murderhole, color: "#2a2422"}   # see and shoot through
    # The country south of the village (assets/wip/south/): forest groves and the hills' edge, low hills, mountain
    # scree, the fortress walls of Tarnhold and the vales' gates.
    "}": {name: Forest, wall: true, tile: forest, color: "#23401f"}
    "{": {name: Hillside, tile: hill, color: "#5f8a46"}
    "`": {name: Scree, tile: scree, fight: rough, color: "#8a8a84"}
    "@": {name: Fortress wall, wall: true, tile: fort, color: "#6a6862"}
    # The mountains climb in rings: the rock (#), a higher ledge ((), the summit (?), each a cliff set over the last.
    # Where the mountains are steep slopes (Tarnhold, the vales, the orc valley: assets/wip/orc/rings.py) they climb a
    # ring a square: # ( ? ▁ ▂ ▃ ▄.
    "(": {name: Mountainside, wall: true, tile: ledge, color: "#7a7a74"}
    "?": {name: Summit, wall: true, tile: summit, color: "#8a8a84"}
    "▁": {name: Ridge, wall: true, tile: ridge3, color: "#82827c"}
    "▂": {name: High ridge, wall: true, tile: ridge4, color: "#8a8a84"}
    "▃": {name: Crags, wall: true, tile: ridge5, color: "#92928c"}
    "▄": {name: Peak, wall: true, tile: ridge6, color: "#9a9a94"}
    # Overlooks: a walkable shelf of rock ([) inside a ring of ledge (▲, drawn as the shelf, as a pyramid's steps are), with
    # steps cut in it; towers (■) raised on a fortress wall.
    "[": {name: Overlook, tile: shelf, color: "#8a7a62"}
    "▲": {name: Ledge, wall: true, rise: true, color: "#7a6a52"}
    "■": {name: Tower, wall: true, tile: tower, color: "#5a5a58"}
    # The jungle west of the grassland (assets/wip/jungle/): marsh (sodden, slow footing) and a trodden trail.
    "≈": {name: Marsh, tile: marsh, fight: rough, color: "#3a3a26"}
    "≡": {name: Trail, tile: trail, color: "#5a4030"}
    # The orc valley (assets/wip/orc/): a quarried hill of grey stone (a wall), the slaver caves cut into it.
    "▤": {name: Quarried rock, wall: true, tile: quarry, color: "#4e5154"}
    # The desert south of the grassland (assets/wip/desert/): outcrops of red sandstone (a wall).
    "▩": {name: Sandstone, wall: true, tile: mesa, color: "#8a4a2a"}
  passivePenalty: 3          # passive perception is this much worse than a deliberate search
  searchBonus: 3             # ...and a search this much better than a plain check
  # ---- Traps (PROVISIONAL, docs/OVERHAUL.md step C; src/rules/traps.js, src/game/explore.js) ---------------------
  # A trap is a legend entry (docs/DATA.md "A trap"): tell, trigger, effect, reset, knownTo, disarm, bypass.
  #   notice   squares away, in sight, at which a passing party gets a first look at a trap (a second beside it)
  #   find     the Perception margin (total - the trap's tn) each degree of finding needs: the tell (something is off
  #            here, no square), the square, the square and its working (what it does and every way past). Knowing
  #            (the trap's `reveal`: lore, a word from a parley) gives the last without a roll.
  #   unknownDisarm  added to the disarm TN while the working is not made out
  #   strike   the TN one who knows it is coming beats to get clear (a dodge) or take it on a shield (a block), when the
  #            trap names none; `caught` comes off that roll when caught in the act (a fumbled disarm, a short leap)
  #   triggers how each trigger reads to the player
  #   bypass   the ways past a trap that names none (`spring` is any of pole, stone, shield that fits the trigger)
  #   ways     each way past: minutes it takes, the check (skills.yaml checks) and its TN, the good it needs, loud (it
  #            draws wanderers and wakes sleepers), the triggers it works on, block (a shield held over on purpose)
  traps:
    notice: 2
    find: {tell: -3, square: 0, mechanism: 3}
    unknownDisarm: 2
    strike: 13
    caught: 3
    triggers: {step: "a loose stone underfoot", wire: "a tripwire", plate: "a pressure plate", lid: "lifting the lid"}
    bypass: [leap, spring, mark]
    ways:
      disarm: {minutes: 10, check: trapcraft}
      leap: {minutes: 1, check: leap, tn: 7}
      edge: {minutes: 3, check: edge, tn: 6}
      pole: {minutes: 2, good: pole, loud: true}
      stone: {minutes: 1, loud: true, triggers: [wire]}
      shield: {minutes: 1, loud: true, triggers: [step, plate, wire], block: 3}
      mark: {minutes: 1}
  camp: {wanderingChance: 0.25, guardedChance: 0.5}
  # ---- Skill checks: d10 + floor(mean of attrs / 2) + feat ranks x weight vs a target number ------
  tn: {trivial: 4, easy: 6, moderate: 8, hard: 11, formidable: 14}
  # ---- Factions -----------------------------------------------------------
  bounty: {on: cutthroats, payer: town_watch, gold: 15, minStanding: 10, standingPer: 0.5}   # who pays for whose dead
  standingMax: 100
  standingTiers: [[-100, Hated], [-60, Hostile], [-25, Wary], [-5, Cool], [5, Neutral], [25, Friendly], [60, Allied], [90, Revered]]
  allyShare: 0.25            # of a standing change, passed to a faction's allies
  enemyShare: 0.5            # ...and passed, inverted, to its enemies
  killStanding: -3           # standing lost with a faction for each of its members you kill
  # ---- Social (parley) ----------------------------------------------------
  parley: {dispositionRange: 5, willingnessMax: 10, standingPerDisposition: 15, bribeStep: 10, fleeFine: 0}
  # ---- Economy ------------------------------------------------------------
  economy:
    rarityValue: {common: 12, uncommon: 60, rare: 300, very rare: 1500, unique: 8000}
    sellRate: 0.4
    priceStanding: 0.004     # price change per standing point with the seller's faction
    bargainRank: 0.05        # per Bargain rank
    repairPerPoint: 0.06     # of the item's value per durability point restored
    innPerHead: 6
    healCostPerPoint: 25     # temple healing, per attribute point healed
    healerStandingFree: 60   # at this standing healing is free of charge

# ---- Skills (the user, 2026-11-07; data/skills.yaml lists them) -----------------------------------------------------
# Points: `start` at level 1, `perLevel` more each level after, spent whenever the party isn't fighting; a skill tops
# out at `max`. No other caps: going all in on one thing costs being worse at everything else.
# tiers: the skill rank a feat's tier needs, in its tree's skill (feats.yaml).
# defense: the share of (the defender's skill in the defence - the attacker's with the blow) that adds to the defence.
#   The defender's: parry, Melee; dodge, Evasion + Anticipation; block, Block. The attacker's: Melee for a blow, Ranged
#   for a shot, Arcane for a spell.
# armorPerRank: each Armor rank takes this share off the armor's SPD, DEX and stamina penalties.
# spPerRank: spell points per Arcane rank (with INT); none at Arcane 0.
# retired: feats that were only a number, and the skill each rank of them became (x perRank) in an old save.
skills:
  start: 10
  perLevel: 3
  max: 10
  tiers: {novice: 1, apprentice: 3, adept: 5, expert: 7, master: 9}
  defense: {parry: 1, dodge: 1, block: 0.5}
  armorPerRank: 0.05
  spPerRank: 2
  retired:
    perRank: 2
    feats: {parry_training: melee, shield_training: block, dodge_training: evasion, read_attack: anticipation, misdirection: deception, grappler: athletics, keen_eye: perception, stealth: stealth, lockpicking: devices, trap_craft: devices, brute_force: athletics, liar: deception, herbalism: nature, intimidate: intimidation, casting: arcane}
