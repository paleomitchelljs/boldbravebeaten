# Rule numbers kept with the content: anything here is merged over src/rules/config.js (deep merge),
# so a tuned value can live beside the files it affects. Keys under `game` are read by the game layer.

# Gear rolled for template foes (foes.yaml), by level band (levels 1–2, 3–5, 6+): weighted [weight, id] lists.
# metal: the material of metal armor and metal-bladed weapons; origin: armor and weapons. Exotic materials and
# enchantments are never rolled: they are placed by hand.
enemyGear:
  craft: [[[3, poor], [7, average]], [[1, poor], [8, average], [1, master]], [[6, average], [3, master]]]
  metal: [[[2, bronze], [3, iron]], [[1, bronze], [4, iron], [1, steel]], [[3, iron], [3, steel]]]
  origin: [[[1, common]], [[18, common], [1, elven], [1, dwarven]], [[8, common], [1, elven], [1, dwarven]]]

# ---- Hit locations (PROVISIONAL, the user's choice: docs/PROPOSALS.md §2, step 1) ------------------------------
# A body is six locations, which are also the six armor slots. An armor piece `covers` some of them (an item without
# `covers` reads its coverage keyword below). share: the part of the body each is, so the part of the blows an
# unaimed blow lands there, and the part of a type's weight, penalties and durability a piece covering it carries
# (a full harness sums to 1, so it plays as one piece always did). A blow rolls its location only against a body
# whose locations differ (a piece here, bare skin there).
# carry: a cut that gets through a location (bare, or cutting through cloth or leather) carries the slashing left
# beyond `limb` into the next location (one of `next`, rolled), where that location's armor meets it. Not the torso.
locations:
  order: [head, torso, arms, hands, legs, feet]
  names: {head: Head, torso: Torso, arms: Arms, hands: Hands, legs: Legs, feet: Feet}
  share: {head: 0.08, torso: 0.40, arms: 0.18, hands: 0.05, legs: 0.24, feet: 0.05}
  coverage: {full: [head, torso, arms, hands, legs, feet], half: [torso, arms, legs], partial: [torso]}
  # aim (step 2): a blow aimed at a location (decl.location; none = unaimed, rolled) pays `penalty` to beat the
  # defence (a thrust `thrustLess` less: a point is placed more easily); a shield blocks blows aimed at what it
  # covers more easily (+`block`).
  aim:
    penalty: {head: 2, torso: 0, arms: 1, hands: 2, legs: 1, feet: 3}
    thrustLess: 1
    shield: {covers: [torso, arms], block: 1}
  # wounds (step 3): what a wound does where it lands. Every blow at a body rolls its location once this is set
  # (a full harness too: the armor is the same everywhere, the body isn't).
  #   attrs   what each point of a cut takes, rolled among these (the old d4 was STR, CON, SPD, DEX everywhere);
  #           a point that goes in (piercing) still takes CON
  #   vital   × the wound roll's chance there (share-weighted to 1, so overall lethality stays put)
  #   effects per point of wound that reached the body there (÷ the target's size): disarm (drops what is in
  #           hand), trip (knocked down); stun: per point of blunt that lands on the head (CON resists, as a spell)
  wounds:
    attrs: {head: [CON, INT, WIL], torso: [CON, STR], arms: [STR, DEX, CON], hands: [DEX, STR], legs: [SPD, CON], feet: [SPD]}
    vital: {head: 2, torso: 1.5, arms: 0.4, hands: 0, legs: 0.7, feet: 0}
    effects:
      head: {stun: 0.1}
      arms: {disarm: 0.08}
      hands: {disarm: 0.15}
      legs: {trip: 0.08}
      feet: {trip: 0.1}
  carry:
    limb: 3
    next: {head: [torso], arms: [torso, head], hands: [arms], legs: [legs], feet: [legs]}

game:
  # ---- Equipment ----------------------------------------------------------
  # Worn slots (the user's list), after the hands, shield and chest (armor). A worn good's `slot` names one of
  # these ids, or a `takes` (both ring slots take a ring). Add a slot here (a waist, ears) and goods can use it.
  wornSlots:
    - {id: head, name: Head}
    - {id: neck, name: Neck}
    - {id: shoulders, name: Shoulders}
    - {id: cape, name: Cape}
    - {id: waist, name: Waist}
    - {id: ear1, name: Ear, takes: ear}
    - {id: ear2, name: Ear, takes: ear}
    - {id: arms, name: Arms}
    - {id: hands, name: Hands}
    - {id: ring1, name: Ring, takes: ring}
    - {id: ring2, name: Ring, takes: ring}
    - {id: legs, name: Legs}
    - {id: feet, name: Boots}
  # ---- Companions (PROVISIONAL, the user's idea; src/game/companions.js) -------------------------------------
  # Which monsters.yaml creatures answer each feat, by rank (rank II adds the second list). The owner may choose
  # among those on offer; otherwise the last (strongest) is taken. death: attribute points a familiar's death costs.
  companions:
    familiar: {ranks: [[duskBat, rat], [fireSprite]], death: {WIL: 2}}
    beast: {ranks: [[wolf], [alphaWolf]]}
  # ---- Starting a game ----------------------------------------------------
  party: {size: 4, attrPool: 40, attrMin: 3, attrMax: 8, startGold: 60}
  # ---- Progression --------------------------------------------------------
  # XP needed to reach level n = xpBase * n * (n - 1) / 2 (so 60, 180, 360, 600…).
  xpBase: 60
  maxLevel: 10
  # Training happens only in town, between adventures. Gold per rank, by the tier of the rank taken.
  trainingCost: {novice: 20, apprentice: 60, adept: 160, expert: 400, master: 1000}
  # ---- Time and exploring -------------------------------------------------
  minutesPerStep: 5
  sneakStepMinutes: 10
  searchMinutes: 20
  noticeDistance: 4          # tiles at which an awake group notices an unhidden party
  sleepNoticeDistance: 2     # ...and a sleeping one
  lightRadius: 7
  arena: {w: 15, h: 10}   # the slice of the dungeon a fight is played on (matches the map view's size)
  joinDistance: 6         # PROVISIONAL: an awake group this close to a fight (with a clear line) joins it
  # ---- Ground (PROVISIONAL, for the temple) ----------------------------------------------------------------------
  # Map letters with the same meaning on every map, besides # wall, . floor, + door and space (rock). A place's
  # look.ground names the letter its plain floor and legend squares stand on (the courtyard is grass); a legend entry
  # may say `on: "<letter>"` for its own square.
  #   walk: false   nobody walks through it (fliers cross; it stops neither sight, missiles nor reach)
  #   wall: true    a wall, drawn with its own tiles
  #   fight         the terrain (CONFIG.terrain) the square becomes in a fight on the map
  #   under         drawn over another letter's ground (a bridge over water)
  #   tile          the terrain of the place's tileset that draws it (data/tilesets.yaml); color without one
  #   rise: true    a riser between terraces (with wall: true, a pyramid's step): drawn as the highest terrain beside
  #                 it, the tier it holds up. A stair through it is a legend prop that is not solid, `on` this letter
  ground:
    ",": {name: Grass, tile: grass, color: "#4a6a34"}
    ";": {name: Rubble, tile: rubble, fight: rough, color: "#7a6a50"}
    "%": {name: Ferns, tile: ferns, color: "#4d6a3a"}
    "~": {name: Deep water, walk: false, fight: deepWater, tile: water, color: "#1f4450"}
    "_": {name: Shallow water, fight: shallows, tile: shallows, color: "#36616a"}
    "=": {name: Plank bridge, under: "~", tile: bridge, color: "#7a5a36"}
    "^": {name: Pyramid step, wall: true, rise: true, color: "#a89468"}
    "-": {name: First terrace, tile: tier1, color: "#bab286"}
    ":": {name: Second terrace, tile: tier2, color: "#bab286"}
    "*": {name: Third terrace, tile: tier3, color: "#bab286"}
    "&": {name: Top terrace, tile: tier4, color: "#bab286"}
    "|": {name: Dais, tile: dais, color: "#c8b67a"}            # a raised platform you walk on (the palace's throne)
  passivePenalty: 3          # passive perception is this much worse than a deliberate search
  camp: {wanderingChance: 0.25, guardedChance: 0.5}
  # ---- Skill checks: d10 + floor(mean of attrs / 2) + feat ranks x weight vs a target number ------
  tn: {trivial: 4, easy: 6, moderate: 8, hard: 11, formidable: 14}
  # ---- Factions -----------------------------------------------------------
  bounty: {on: cutthroats, payer: town_watch, gold: 15, minStanding: 10, standingPer: 0.5}   # who pays for whose dead
  standingMax: 100
  standingTiers: [[-100, Hated], [-60, Hostile], [-25, Wary], [-5, Cool], [5, Neutral], [25, Friendly], [60, Allied], [90, Revered]]
  allyShare: 0.25            # of a standing change, passed to a faction's allies
  enemyShare: 0.5            # ...and passed, inverted, to its enemies
  killStanding: -3           # standing lost with a faction for each of its members you kill
  # ---- Social (parley) ----------------------------------------------------
  parley: {dispositionRange: 5, willingnessMax: 10, standingPerDisposition: 15, bribeStep: 10, fleeFine: 0}
  # ---- Economy ------------------------------------------------------------
  economy:
    rarityValue: {common: 12, uncommon: 60, rare: 300, very rare: 1500, unique: 8000}
    sellRate: 0.4
    priceStanding: 0.004     # price change per standing point with the seller's faction
    bargainRank: 0.05        # per Bargain rank
    repairPerPoint: 0.06     # of the item's value per durability point restored
    innPerHead: 6
    healCostPerPoint: 25     # temple healing, per attribute point healed
    healerStandingFree: 60   # at this standing healing is free of charge
