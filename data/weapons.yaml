# Weapons, including the natural weapons of monsters (natural: true).
# phys describes the weapon physically (mass kg, length m, point/edge/head); damage, AP, STR scaling and
# wounds are worked out from it (Items.weaponStats). See src/rules/data.js for the field list.
# durability: how much wear the weapon takes before it breaks (standard quality, its own material);
# fragility: how hard each knock bites (a rapier's thin blade 2, a mace's head 0.5). See CONFIG.weaponWear.

club:
  phys: {mass: 1, length: 0.7, head: {mass: 0.6}}
  name: Club
  hands: 1
  weight: light
  reach: 2
  reachName: short
  closeOK: true
  material: wood
  durability: 60
  fragility: 1.0
  faces: {head: [0, 0, 4]}
  motions: [swing, power]
  rarity: common
  notes: "Cheapest; common starter."
