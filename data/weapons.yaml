# Weapons, including the natural weapons of monsters (natural: true).
# phys describes the weapon physically (mass kg, length m, point/edge/head); damage, AP, STR scaling, wounds and
# punch through armor are worked out from it (Items.weaponStats). See src/rules/data.js for the field list.
# An item is a type plus a material, origin, craft and enchantments (see armor.yaml); material and origin change
# the mass, so the physics follows.
# reach: squares each motion reaches, {swing, thrust, min}. A square is about an arm's length plus a step:
#   daggers 1; one-handed swords, maces and axes swing 1 and thrust 2; two-handed weapons swing 2 and thrust 3;
#   spears thrust to 4. Inside `min` (default 1) the weapon is cramped (CONFIG.range.closeRule).
# closeOK: works in a clinch without being cramped (daggers, short hafts); long blades and spears don't.
# dagger: counts as a dagger (Coup de Grâce; the AI's stab in a grapple).
# durability: how much wear the weapon takes before it breaks (average craft, its own material);
# fragility: how hard each knock bites (a rapier's thin blade 1.25, a mace's head 0.5). See CONFIG.weaponWear.
# punch (on a point or arrow, optional): overrides the punch worked out from mass (CONFIG.pierce): a dagger is
#   driven by the whole arm; an arrow's punch is the bow's. maxPunch: a flexible blade bends past this however
#   hard it is driven (a rapier's 1.2 never bursts mail).

