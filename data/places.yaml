    D: {kind: stairs, to: ember_duct, at: C, up: true, sprite: none, label: "Up the ramp to the duct"}
    G: {kind: locked, see: true, tn: 16, forceTn: 20, label: "The citadel's gates", text: "Iron gates three times a man's height, barred inside with a beam of iron. A barred window looks out over the ramp."}
    g: {kind: monster, encounter: gate, label: "The gate's guards"}
    # F-9a, the north gate onto the chasm
    N: {kind: note, sprite: none, label: "The chasm", text: "Beyond the lattice the passage ends at a ledge over a black chasm strung with webs as thick as ropes. Something huge hangs in them, far off. (Not built yet.)"}
    q: {kind: monster, encounter: lattice, label: "A giant on watch at the lattice"}
    # F-2, common quarters
    s: {kind: monster, encounter: sleeper, asleep: true, label: "A fire giant asleep"}
    n: {kind: note, label: "Giants' quarters", text: "A stone bed under furs, a table the height of your chin, carvings of giants at war on every wall. Nobody home."}
    c: {kind: chest, label: "A giant's chest", loot: relic_cache, rolls: 1, tn: 12}
    # F-3, the grand hall, and F-4, the cookhouse
    e: {kind: monster, encounter: hall, label: "Giants at table"}
    T: {kind: prop, sprite: c_table, label: "A stone table eleven feet high"}
    C: {kind: prop, sprite: c_chair, label: "The one true chair: worked stone lined with obsidian and lapis"}
    k: {kind: monster, encounter: cook, label: "The cook"}
    u: {kind: prop, sprite: c_cauldron, label: "A cauldron you could bathe in"}
    # F-5, the arena
    a: {kind: monster, encounter: arena, label: "Giants sparring in the pit"}
    # F-6, the warlord's house
    W: {kind: monster, encounter: warlord, label: "The warlord and his daughters"}
    H: {kind: chest, label: "The warlord's strongbox", loot: relic_cache, rolls: 2, tn: 15}
    # F-7, the giant forge, and F-8, the mines
    f: {kind: monster, encounter: smith, label: "The smith at the forge"}
    F: {kind: prop, sprite: c_forge, label: "A giant's forge, the coals white"}
    A: {kind: prop, sprite: c_anvil, label: "An anvil the size of a cart"}
    R: {kind: prop, sprite: c_rack, label: "Swords and spears awaiting owners"}
    m: {kind: monster, encounter: miners, label: "Giants at work in the mine"}
    # F-9, the courtyard
    b: {kind: prop, sprite: c_brazier, label: "A brazier on an iron tripod"}
    B: {kind: prop, sprite: c_bench, label: "A wrought-iron bench"}
    # F-10, the temple of war
    S: {kind: prop, sprite: c_statue, label: "A giant at war, in basalt"}
    O: {kind: note, label: "The temple's carvings", text: "The architrave tells of a god's war against the other gods, fought for nothing but the glory of it, and lost. The giants carved the defeat as proudly as the war."}
    # F-11, the jeweller's forge and kiln
    j: {kind: monster, encounter: jeweller, label: "A jeweller at the kiln"}
    J: {kind: chest, label: "A tray of giant-sized jewels", loot: relic_cache, rolls: 2, tn: 14}
    # F-12, the magus's house
    M: {kind: monster, encounter: magus, label: "The magus"}
    X: {kind: prop, sprite: c_sphere, label: "A crystal sphere that burns with lava light"}
    Y: {kind: chest, label: "The magus's study", loot: relic_cache, rolls: 2, tn: 16}
    # F-13, the hall of wizardry
    w: {kind: monster, encounter: wizard, label: "A giant at study"}
    # F-14, the mausoleum
    P: {kind: monster, encounter: shades, label: "Red mist between the coffins"}
    o: {kind: prop, sprite: c_coffin, label: "A granite coffin, sized for a giant"}
    E: {kind: chest, label: "The oldest tomb", loot: relic_cache, rolls: 2, tn: 14}
    # F-15, the torture pit and the guest rooms
    i: {kind: note, label: "A guest room, very cold", text: "Frost on the walls of a room in a city of fire. Whoever stays here comes from the far north, and serves another dragon."}
    r: {kind: prop, sprite: pit_still, label: "The torture pit", text: "Bones at the bottom, of every kind."}
    # F-16, the king's palace
    h: {kind: monster, encounter: royalguard, label: "The king's guard"}
    K: {kind: monster, encounter: king, label: "The king of the giants"}
    U: {kind: prop, sprite: throne, label: "The king's throne"}
    l: {kind: note, sets: [read_egg_letter], label: "A letter in white wax", text: "A letter in a cold, fine hand, from a dragon of the ice in the far north to the lord of the lair below. She is tired of fine words, she writes; their egg lies safe in her chamber and life stirs in it, but it will not hatch without him. She waits on his plan for his escape, and asks the king to send it on."}
    z: {kind: chest, label: "The king's treasury", loot: relic_cache, rolls: 3, tn: 16}
    # F-17, the vestibule
    v: {kind: monster, encounter: vestibule, label: "The dragon's door wardens"}
    y: {kind: prop, sprite: c_dragon, label: "A bronze dragon rearing, its eyes two rubies"}
    x: {kind: prop, sprite: c_whitedragon, label: "An alabaster dragon, slender, its eyes two sapphires"}
    L: {kind: stairs, to: ember_lair, at: V, sprite: none, label: "The tunnel to the dragon's lair"}
  encounters:
    gate: {foes: [{monster: fireGiantGuard}, {monster: fireGiantGuard}], text: "Two giants in black iron plate turn from the window and draw swords as long as you are tall."}
    lattice: {foes: [{monster: fireGiantGuard}], text: "A young giant on the lattice watch, glad of something to do."}
    sleeper: {foes: [{monster: fireGiant}], text: "A giant heaves up off its furs."}
    hall: {foes: [{monster: fireGiant}, {monster: fireGiant}, {monster: fireGiantYoung}], text: "Giants at the long tables put down their cups."}
    cook: {foes: [{monster: fireGiant}], text: "The cook comes round the cauldron with a ladle like a club."}
    arena: {foes: [{monster: fireGiantYoung}, {monster: fireGiantYoung}, {monster: fireGiantGuard}], text: "The sparring stops. Here is better sport."}
    warlord: {foes: [{monster: fireGiantWarlord}, {monster: fireGiantYoung}, {monster: fireGiantYoung}], text: "The warlord does not parley. His daughters hang back, feigning fear, until they see an opening."}
    smith: {foes: [{monster: fireGiant}], text: "The smith turns from the anvil with the hammer still in his fist."}
    miners: {foes: [{monster: fireGiant}, {monster: fireGiantYoung}, {monster: fireGiantYoung}, {monster: fireGiantYoung}], text: "The young giants drop their picks for their fists; the foreman wades in after them."}
    jeweller: {foes: [{monster: fireGiant}], text: "The jeweller sets down something delicate and stands up, and up."}
    magus: {foes: [{monster: fireGiantMagus}], text: "The old magus rises in a wash of coloured crystal light."}
    wizard: {foes: [{monster: fireGiantWizard}], text: "A giant wizard looks up from a book of fire, delighted."}
    shades: {foes: [{monster: giantShade}, {monster: giantShade}], text: "The red mist in the marble gathers itself into two dead giants, and they rise to serve."}
    royalguard: {foes: [{monster: fireGiantGuard}, {monster: fireGiantGuard}], text: "The king's guard close the doors behind you."}
    king: {foes: [{monster: fireGiantKing}, {monster: fireGiantGuard}], flags: [giant_king_dead], text: "The king of the giants takes up his maul."}
    vestibule: {foes: [{monster: fireGiantGuard}, {monster: fireGiantWizard}], text: "The two wardens of the dragon's door, a warrior and a wizard, step out from between the statues."}
  wandering:
    - {w: 1, foes: [{monster: fireGiantGuard}], text: "A giant warrior on his rounds of the courtyard."}
    - {w: 1, foes: [{monster: fireGiant}], text: "A giant crossing the courtyard."}
    - {w: 4, nothing: true}
  secrets: []

