  legend:
    ù: {kind: pickup, good: kobold_bane_oil, text: "A flask of rank oil, kept by someone who meant to use it on the king."}
    # Ways out: the two tunnels north to the bridges and the goblins' hall (B west, A east), the lava duct to the gnomes
    # (D), the old tunnel down toward the deep (E), and two tunnels out to the mountains (east, and K-1's south).
    N: {kind: stairs, to: ember_hall, at: N, up: true, sprite: none, label: "The west tunnel, to the bridge and the goblins' hall"}
    O: {kind: stairs, to: ember_hall, at: O, up: true, sprite: none, label: "The east tunnel, to the bridge and the goblins' hall"}
    D: {kind: stairs, to: ember_gnomes, at: d, sprite: none, label: "A lava duct running north-west, toward the gnomes"}
    E: {kind: stairs, to: ember_duct, at: k, sprite: none, label: "A tunnel that drops away into heat and black glass, toward the deep"}
    M: {kind: stairs, to: bz_5_8, at: K, up: true, sprite: none, label: "The east tunnel, up a steep grade to the mountainside", text: "Vapour from vents in the tunnel floor stings the eyes and the throat."}
    S: {kind: stairs, to: bz_5_8, at: K, up: true, sprite: none, label: "The south tunnel, out to the mountainside"}
    # K-1 and K-6: the guard rooms at the two ways in
    a: {kind: monster, encounter: firstguard, label: "The first guard room"}
    g: {kind: monster, encounter: watchers, label: "The tunnel watchers"}
    # K-2: the miners' clan dens
    b: {kind: monster, encounter: workers, label: "The miners' dens"}
    f: {kind: prop, sprite: k_mat, solid: false, label: "A family's sleeping mat of woven fur, dyed red and brown, a dragon's wings worked into it"}
    t: {kind: prop, sprite: k_statue, label: "A rough statuette of a winged dragon"}
    j: {kind: prop, sprite: k_mobile, solid: false, label: "Chips of obsidian hung from a bone, turning in the hot air"}
    w: {kind: prop, sprite: k_pool, label: "A steaming pool", text: "The water is near boiling and stinks of sulphur. The kobolds bathe in it."}
    # K-3: the hunters' clan dens
    c: {kind: monster, encounter: hunters, label: "The hunters' dens"}
    i: {kind: prop, sprite: k_skulls, label: "Goblin skulls ringed with beads round a rack of captured spears"}
    X: {kind: chest, sprite: k_box, label: "The clan leader's stone treasure box", loot: strongbox, tn: 10}
    # K-4: the refuse pit and its hounds
    h: {kind: monster, encounter: pit, label: "Something growls in the stink"}
    r: {kind: prop, sprite: k_refuse, solid: false, label: "Refuse steaming in a hollow of the floor", text: "Offal, bones and filth to fill several wagons, bubbling over some heat below. The stench turns the stomach."}
    y: {kind: prop, sprite: k_chain, solid: false, label: "A chain staked into the rock, worn bright"}
    # K-5: the den of lessons
    l: {kind: monster, encounter: lessons, label: "The den of lessons"}
    u: {kind: note, label: "Pictograms", text: "Pictures cover the round walls, spiralling down from the top of the dome: the first kobolds hewn out of rock; a king who fell; long darkness; then a winged serpent of fire, vast, with kobolds bowing before it and giants at its back. The last ring shows small bearded figures coming into the mountain, and stops short."}
    # K-7: the guardian clan's dens
    v: {kind: monster, encounter: guardians, label: "The guardians' dens"}
    m: {kind: prop, sprite: k_mandibles, label: "A pair of huge mandibles framing a den's mouth"}
    s: {kind: prop, sprite: k_skulls, label: "Goblin skulls and a few others: gnome, elf, human"}
    Y: {kind: chest, sprite: k_box, label: "A stone box behind a loose stone in the elder's niche", loot: relic_cache, rolls: 1, tn: 12}
    # K-8: the most sacred pool
    p: {kind: monster, encounter: sacredpool, label: "Shapes in the steam"}
    P: {kind: prop, sprite: k_pool_long, label: "The sacred pool", text: "An oblong pool ringed with obsidian tiles, steaming so thick you see only a few paces. Every kobold is dipped in it once, to bind it to the dragon."}
    Q: {kind: note, label: "Frescoes", text: "A fresco on each wall: miners drawing obsidian; hunters watching the ways in; warriors against goblins and many-legged things; and on the west wall a winged serpent in a crown of gold, one claw raised in judgement."}
    # K-9 and K-10: the king's fire-pit hall and his den
    k: {kind: monster, encounter: king, label: "The king's hall"}
    T: {kind: prop, sprite: k_throne, label: "A throne cut from one block of obsidian", text: "Behind it, carved in the wall, a line of kobold kings. The last face is old and looks a lot like the one that sat here."}
    z: {kind: prop, sprite: k_brazier, label: "A bronze brazier cast as a dragon's open mouth, full of coals"}
    q: {kind: note, label: "The king's den", text: "Silk cushions, tapestries of three different makers, furniture from wagons that came through the mountains and never left them. Incense almost hides the smell of the mine."}
    Z: {kind: chest, label: "A wardrobe of human make, and what the king keeps in it", loot: relic_cache, rolls: 2, tn: 12}
    # K-11 and K-11a: the hall of howling and its keeper
    H: {kind: monster, encounter: howling, label: "The hall of howling"}
    W: {kind: prop, sprite: k_pool, label: "A deep pool glowing with pale fungus", text: "The light from the pool plays over carvings, paintings and floor mosaics of a dragon, and over a dragon picked out in quartz on the ceiling, which seems to fly."}
    K: {kind: monster, encounter: keeper, label: "The keeper's den"}
    # K-12: the old hall, left to the spirit of the spring
    x: {kind: monster, encounter: spirit, label: "Steam gathers over the pool"}
    V: {kind: chest, sprite: k_pool, label: "The old pool, coins and gems glinting at its bottom", loot: relic_cache, rolls: 1, tn: 8}
    # K-13 and K-13a: the mines
    n: {kind: monster, encounter: miners, label: "Picks ringing in the mines"}
    C: {kind: prop, sprite: k_trough, label: "A stone water trough, divided in the middle"}
    o: {kind: prop, sprite: k_brazier, label: "A brazier of hot coals; the miners carry them into the tunnels on hollow stones"}
    e: {kind: monster, encounter: deeptunnel, label: "A side tunnel, scratched and scored"}
    # K-14: the obsidian shapers
    d: {kind: monster, encounter: shapers, label: "Hammers on glass"}
    B: {kind: prop, sprite: k_bench, label: "A shelf cut in the wall for a workbench: hammers, chisels, files, tongs"}
    L: {kind: prop, sprite: k_shards, solid: false, label: "A heap of black flakes: blades that broke in the making"}
    R: {kind: prop, sprite: k_crate, label: "A crate of rough obsidian slabs"}
    # K-15: the cavern of the watch
    G: {kind: monster, encounter: watchpost, label: "A watch station"}
    U: {kind: monster, encounter: watchleader, label: "The cavern of the watch"}
    F: {kind: note, label: "The sparring ground", text: "The middle of the cavern is open and flat, flecked with old blood. No bedding anywhere: the watch sleep on the hot stone, to prove they can."}
  encounters:
    firstguard: {foes: [{monster: koboldHunter}, {monster: koboldHunter}, {monster: koboldShaman}], text: "Two kobolds by the tunnel mouth are watching it; the others drop their dice. A shaman among them lifts a skull on a staff."}
    watchers: {foes: [{monster: koboldHunter}, {monster: koboldSpearman}, {monster: koboldShaman}], text: "They were listening for you choking in the tunnel. They come round the corner fast."}
    workers: {foes: [{monster: koboldWorker}, {monster: koboldWorker}, {monster: koboldShaman}], text: "Most of the dens are empty by day. The shaman watching over them, and two who stayed behind, are not."}
    hunters: {foes: [{monster: koboldHunter}, {monster: koboldHuntLeader}], text: "Hunters skinning the day's kill look up, and reach for their bows."}
    pit: {foes: [{monster: gorgeHound}, {monster: gorgeHound}, {monster: koboldHunter}], text: "Two great red hounds come off their chains' ends at you; their keeper runs the other way, shouting."}
    lessons: {foes: [{monster: koboldShaman}, {monster: koboldElder}], text: "The pups scatter. Two shamans step between you and them."}
    guardians: {foes: [{monster: koboldWarrior}, {monster: koboldWarrior}, {monster: koboldElder}], text: "Warriors come out of the dens on both sides; behind them an elder raises its staff, and their muscles swell."}
    sacredpool: {foes: [{monster: koboldHighShaman}, {monster: koboldElder}], text: "Two figures rise out of the steam: the high shaman, and an elder at its side."}
    king: {foes: [{monster: koboldKing}, {monster: koboldSpearman}], flags: [kobold_king_dead], text: "The old king rises from his black throne and takes up a bronze axe. His champion is already moving."}
    howling: {foes: [{monster: koboldWarrior}, {monster: koboldWorker}], text: "Kobolds at the pool's edge stop their howling and turn on you."}
    keeper: {foes: [{monster: koboldElder}, {monster: koboldSpearman}], text: "The keeper of the hall comes out between its guards, beads clicking at the doorway."}
    spirit: {foes: [{monster: steamElemental}], text: "A shape of steam stands up out of the pool. It does not want you here."}
    miners: {foes: [{monster: koboldWorker}, {monster: koboldWorker}, {monster: koboldWarrior}], text: "Miners turn from the rock with their claws; the overseer comes after them."}
    deeptunnel: {foes: [{monster: lavaBeetle}], text: "A lava beetle backs out of a side tunnel, mandibles open."}
    shapers: {foes: [{monster: koboldDuelist}, {monster: koboldWorker}], text: "The crafters put down their work; one of them takes up a finished blade."}
    watchpost: {foes: [{monster: koboldSpearman}, {monster: koboldWarrior}], text: "The watch on the bridge tunnel turn as one."}
    watchleader: {foes: [{monster: koboldDuelist}, {monster: koboldWarrior}, {monster: koboldWarrior}], text: "The sparring stops. The watch's leader points its blade at you."}
  wandering:
    - {w: 1, foes: [{monster: koboldHunter}, {monster: koboldWarrior}], text: "A kobold patrol, noses up."}
    - {w: 1, foes: [{monster: koboldWarrior}, {monster: koboldShaman}], text: "Two kobolds between the dens stop dead, nostrils wide, and snarl."}
    - {w: 4, nothing: true}
  secrets: []

ember_citadel:
  name: The Giants' Citadel
  kind: dungeon
  blurb: A city of fire giants at the bottom of the mine. Black basalt veined with glowing quartz, a cavern lit by braziers. Past the king's palace, a guardhouse keeps the way to the dragon.
  level: 7
  look: {wall: "#2b2731", floor: "#37323e", ceiling: "#0c0b0e", fog: "#0c0608", torch: 1, tileset: ember_citadel, light: 9}
  map:
