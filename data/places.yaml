# Places: the town and the dungeons. See docs/DATA.md for the full field list.
#
# A town has locations (each with people to talk to and services) and exits to dungeons.
# A dungeon has a map (one string per row), a legend for the letters on it, the encounters those
# letters refer to, and the first-person look. Standard map characters:
#   # wall   . floor   + door (opens when walked into)   space = solid rock
# Anything else is defined in the legend. Legend kinds:
#   stairs {to, at}                   at = the legend letter you arrive on in the other place
#   locked {tn, forceTn, key, alt}    picking (lockpicking), forcing (loud), a key item, or alt actions
#   secret {tn}                       looks like wall until found (perception; searching helps)
#   trap   {tn, disarm, damage, text} hidden until noticed; springs if you walk onto it unseen
#   monster {encounter, asleep}       a group; see encounters below
#   chest  {loot, tn, trap}           tn = lockpicking to open without breaking it
#   pickup {good} / note {text} / npc {npc} / shrine {heal}
# Conditions (requires/hide/reveal): see src/game/conditions.js.

stonebridge:
  name: Stonebridge
  kind: town
  blurb: A river town on a trade road, with a toll gate, a market, a temple and a long list of things people do not discuss.
  look: {sky: "#6f8aa6", ground: "#7a6a52", accent: "#c8a05a"}
  start: tilted_cask
  locations:
    - id: tilted_cask
      name: The Tilted Cask
      glyph: "🍺"
      blurb: The inn and the common room. Everyone passes through; most of them talk.
      npcs: [marta_quill, old_dagmar, sly_corvin]
      services: [{kind: inn, name: "A room for the night"}]
    - id: forge
      name: Brannock's Forge
      glyph: "🔨"
      blurb: Arms and armor, new and used, and repairs.
      npcs: [brannock]
      services:
        - kind: shop
          id: forge
          name: The forge
          faction: merchants_guild
          repair: true
          buys: [weapon, armor, shield]
          stock:
            - {weapon: club}
            - {weapon: dagger}
            - {weapon: parryingDagger}
            - {weapon: shortSpear}
            - {weapon: spikedMace}
            - {weapon: rapier}
            - {weapon: longsword}
            - {weapon: shortbow}
            - {armor: padded, coverage: full}
            - {armor: leather, coverage: full}
            - {armor: leather, coverage: half}
            - {armor: leather, covers: [head]}
            - {armor: leather, covers: [hands]}
            - {armor: leather, covers: [feet]}
            - {armor: padded, covers: [torso, arms]}
            - {shield: buckler, material: wood}
            - {shield: round, material: wood}
            - {armor: mail, material: bronze, coverage: half}
            - {armor: mail, coverage: half, req: {standing: {faction: merchants_guild, min: 10}}}
            - {armor: mail, coverage: full, req: {standing: {faction: merchants_guild, min: 10}}}
            - {armor: mail, covers: [torso, arms], req: {standing: {faction: merchants_guild, min: 10}}}
            - {armor: mail, covers: [head], req: {standing: {faction: merchants_guild, min: 10}}}
            - {armor: mail, covers: [legs], req: {standing: {faction: merchants_guild, min: 10}}}
            - {armor: plate, covers: [head], req: {standing: {faction: merchants_guild, min: 25}}}
            - {armor: plate, covers: [torso], req: {flag: guild_stock}}
            - {armor: plate, covers: [legs], req: {flag: guild_stock}}
            - {armor: plate, covers: [arms], req: {flag: guild_stock}}
            - {armor: plate, covers: [hands], req: {flag: guild_stock}}
            - {weapon: warhammer, req: {standing: {faction: merchants_guild, min: 10}}}
            - {weapon: rondel, req: {standing: {faction: merchants_guild, min: 10}}}
            - {weapon: longbow, req: {standing: {faction: merchants_guild, min: 10}}}
            - {shield: round, material: iron, req: {standing: {faction: merchants_guild, min: 10}}}
            - {shield: heater, material: wood, req: {standing: {faction: merchants_guild, min: 25}}}
            - {weapon: greatsword, req: {flag: guild_stock}}
            - {armor: mail, material: steel, coverage: half, req: {flag: guild_stock}}
            - {weapon: heavySpear, req: {flag: guild_stock}}
            - {armor: mail, material: steel, coverage: full, req: {flag: guild_stock}}
    - id: market
      name: The Market Row
      glyph: "⚖"
      blurb: Stalls, scales and the Guild's hall at the end of the row.
      npcs: [guildmaster_pell, wren_urchin]
      services:
        - kind: shop
          id: market
          name: General goods
          faction: merchants_guild
          buys: [good]
          stock:
            - {good: bandage}
            - {good: arrows}
            - {good: salve}
            - {good: tonic}
            - {good: repair_kit}
            - {good: salt}
            - {good: candle}
            - {good: ink}
            - {good: chalk}
            - {good: herbs}
            - {good: antidote, req: {standing: {faction: merchants_guild, min: 10}}}
            - {good: bodkin_arrows, req: {standing: {faction: merchants_guild, min: 10}}}
            - {good: silverDust, req: {standing: {faction: merchants_guild, min: 30}}}
            - {good: tome_stone, req: {flag: guild_stock}}
            - {good: tome_roots, req: {flag: guild_stock}}
    - id: lantern_house
      name: The Lantern House
      glyph: "🏮"
      blurb: The temple. Quiet, lamp-lit, and always short of beds.
      npcs: [warden_ysa]
      services: [{kind: healer, name: "Tending the hurt", faction: lantern_order}]
    - id: yard
      name: The Training Yard
      glyph: "🎯"
      blurb: Between adventures, you can learn. Not during.
      npcs: []
      services: [{kind: trainer, name: "Instruction"}]
    - id: gatehouse
      name: The Gatehouse
      glyph: "🛡"
      blurb: The Watch keeps its books and its prisoners here.
      npcs: [captain_hollis]
      services: [{kind: bounty, name: "Bounty board", faction: town_watch}]
  exits:
    - {to: village, label: "Out to the village green", arrive: I}
    - {to: temple_court, label: "The temple in the jungle", arrive: "<"}
    - {to: ember_hall, label: "The fire-goblin mine", arrive: "<"}
  secrets: []

