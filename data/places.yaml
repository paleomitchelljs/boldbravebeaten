# ---- Burazese cities (inside the walls). Their gates stand in the open world (data/outdoors.yaml, tools/worldgen.js).

muawi_city:
  name: Muawi
  kind: town
  blurb: A Lizardfolk lake city of reed houses and stone causeways. The water market floats on pontoons.
  look: {sky: "#5a7a8a", ground: "#4a6a50", accent: "#7a9a6a"}
  start: scaled_hall
  locations:
    - id: scaled_hall
      name: The Scaled Hall
      glyph: "🍺"
      blurb: A long hall of woven reed and carved stone. Lizardfolk share bowls of spiced fish.
      npcs: []
      services: [{kind: inn, name: "A mat by the fire"}]
    - id: lakemarket
      name: The Lakemarket
      glyph: "⚖"
      blurb: Pontoons roped together on the lake. Fish, reed-work, and shells change hands.
      npcs: []
      services:
        - kind: shop
          id: muawi_market
          name: Lake goods
          buys: [good]
          stock:
            - {good: bandage}
            - {good: arrows}
            - {good: salve}
            - {good: tonic}
            - {good: herbs}
    - id: deep_temple
      name: Temple of the Deep
      glyph: "🏮"
      blurb: A stone shrine half-submerged in the lake. The priests tend the sick in the shallows.
      npcs: []
      services: [{kind: healer, name: "The lake's mercy"}]
    - id: reed_yard
      name: The Reed Yard
      glyph: "🎯"
      blurb: A training ground on a wide causeway. The drillmaster is a scarred Lizardfolk veteran.
      npcs: []
      services: [{kind: trainer, name: "Instruction"}]
    - id: scale_forge
      name: The Scale Forge
      glyph: "🔨"
      blurb: A forge built on a stone platform. Bronze and bone tools hang from racks.
      npcs: []
      services:
        - kind: shop
          id: muawi_forge
          name: Arms and armor
          buys: [weapon, armor, shield]
          stock:
            - {weapon: club}
            - {weapon: dagger}
            - {weapon: shortSpear}
            - {weapon: spikedMace}
            - {armor: padded, coverage: full}
            - {armor: leather, coverage: full}
            - {armor: leather, coverage: half}
            - {shield: buckler, material: wood}
            - {shield: round, material: wood}
    - id: wardens_dock
      name: The Warden's Dock
      glyph: "🛡"
      blurb: A stone dock where the lake wardens moor. A board of bounties nailed to the post.
      npcs: []
      services: [{kind: bounty, name: "Lake wardens' board"}]
  exits:
    - {to: bz_2_4, label: "Out to the lake district", arrive: C}
  secrets: []

zhomelonga_city:
  name: Zhomelonga
  kind: town
  blurb: River-Fortress, seat of the Muzhumewe Hegemony. Stone walls, stepped plazas, and the smell of smelted copper.
  look: {sky: "#5a6a7a", ground: "#6a6050", accent: "#b8905a"}
  start: sovereigns_rest
  locations:
    - id: sovereigns_rest
      name: The Sovereign's Rest
      glyph: "🍺"
      blurb: A grand inn in the shadow of the Hegemon's palace. The beds are clean and the walls are thick.
      npcs: []
      services: [{kind: inn, name: "A room in the capital"}]
    - id: grand_market
      name: The Grand Market
      glyph: "⚖"
      blurb: The largest market on the continent. Copper, jade, hides, and spice from every Hegemony city.
      npcs: []
      services:
        - kind: shop
          id: zhomelonga_market
          name: Grand market goods
          buys: [good]
          stock:
            - {good: bandage}
            - {good: arrows}
            - {good: salve}
            - {good: tonic}
            - {good: herbs}
            - {good: antidote}
            - {good: repair_kit}
    - id: fire_tongue_temple
      name: Temple of the Fire-Tongue
      glyph: "🏮"
      blurb: A stepped pyramid in the city's heart. Smoke rises from braziers at every tier.
      npcs: []
      services: [{kind: healer, name: "The fire's cleansing"}]
    - id: hegemons_yard
      name: The Hegemon's Yard
      glyph: "🎯"
      blurb: The military yard where the Hegemony's legions train. Open to those with standing.
      npcs: []
      services: [{kind: trainer, name: "Instruction"}]
    - id: master_forge
      name: The Master Forge
      glyph: "🔨"
      blurb: The finest smiths on Burazese work here. Bronze, copper, and rare steel.
      npcs: []
      services:
        - kind: shop
          id: zhomelonga_forge
          name: Arms and armor
          buys: [weapon, armor, shield]
          stock:
            - {weapon: club}
            - {weapon: dagger}
            - {weapon: shortSpear}
            - {weapon: spikedMace}
            - {weapon: rapier}
            - {weapon: longsword}
            - {weapon: warhammer}
            - {armor: padded, coverage: full}
            - {armor: leather, coverage: full}
            - {armor: leather, coverage: half}
            - {armor: mail, material: bronze, coverage: full}
            - {armor: mail, material: bronze, coverage: half}
            - {shield: buckler, material: wood}
            - {shield: round, material: wood}
            - {shield: round, material: iron}
    - id: gate_of_laws
      name: The Gate of Laws
      glyph: "🛡"
      blurb: The Hegemony's court of justice. Bounties posted for threats to the state.
      npcs: []
      services: [{kind: bounty, name: "Hegemony bounties"}]
  exits:
    - {to: bz_1_7, label: "Out through the great gate", arrive: C}
  secrets: []

barjiy_city:
  name: Barjiy
  kind: town
  blurb: A walled Human city on the southern plateau. Iron-shod gates, a cathedral of dark stone, and the prince's banner on every tower.
  look: {sky: "#7f8a96", ground: "#6a5a4a", accent: "#a0784a"}
  start: iron_crown
  locations:
    - id: iron_crown
      name: The Iron Crown
      glyph: "🍺"
      blurb: A solid inn near the gate. Iron chandeliers and a fireplace you could stand in.
      npcs: []
      services: [{kind: inn, name: "A room at the Crown"}]
    - id: bazaar
      name: The Bazaar
      glyph: "⚖"
      blurb: A covered market in the old quarter. Human merchants and a few Lizardfolk traders.
      npcs: []
      services:
        - kind: shop
          id: barjiy_market
          name: Bazaar goods
          buys: [good]
          stock:
            - {good: bandage}
            - {good: arrows}
            - {good: salve}
            - {good: tonic}
            - {good: herbs}
            - {good: repair_kit}
    - id: cathedral
      name: Cathedral of Light
      glyph: "🏮"
      blurb: A tall cathedral of dark basalt. The priests tend the wounded and pray for the prince.
      npcs: []
      services: [{kind: healer, name: "The Light's mercy"}]
    - id: princes_yard
      name: The Prince's Yard
      glyph: "🎯"
      blurb: A training yard inside the castle walls. The prince's men-at-arms drill here.
      npcs: []
      services: [{kind: trainer, name: "Instruction"}]
    - id: ironworks
      name: The Ironworks
      glyph: "🔨"
      blurb: The city's forge district. Iron and some steel, worked by Human smiths.
      npcs: []
      services:
        - kind: shop
          id: barjiy_forge
          name: Arms and armor
          buys: [weapon, armor, shield]
          stock:
