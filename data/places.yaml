  map:
    - "@@@@@@@@@@@@xxx@@@@@@@@@@@@"
    - "@.........n@xxx@n.......X.@"
    - "@.@@.......@xxx@.........i@"
    - "@.@@..a....@xxx@....k.....@"
    - "@...........bbb...........@"
    - "@..........@xxx@......@@..@"
    - "@f......q..@xxx@...e..@@..@"
    - "@....W...e.@xxx@.....E...f@"
    - "@@@@@@@@@@@@xxx@@@@@@@@@@@@"
  legend:
    W: {kind: stairs, to: bz_6_10, at: Q, label: "Stairs down to the western door"}
    E: {kind: stairs, to: bz_6_10, at: R, label: "Stairs down to the eastern door"}
    x: {kind: prop, sprite: passage_below, label: "The gate passage, far below"}
