    - "######################"
    - "##..................##"
    - "##.g..........b.....##"
    - "##..................##"
    - "##..b.......c.......##"
    - "##..................##"
    - "##..c.......g.......##"
    - "##..................##"
    - "##..####..####......##"
    - "##..####..####......##"
    - "##..##......##..B...##"
    - "##..##..H...##......##"
    - "##..##......##......##"
    - "##..##..b.r.##......##"
    - "##..##......##......##"
    - "##..##......##..<...##"
    - "######################"
    - "######################"
  legend:
    "<": {kind: stairs, to: stonebridge, sprite: none, label: "Up to the street"}
    c: {kind: prop, sprite: stoneblocks, solid: false, label: "Crates stacked against the wall"}
    b: {kind: prop, sprite: barrels, label: "Barrels"}
    g: {kind: monster, encounter: guards, label: "A smuggler on watch"}
    r: {kind: monster, encounter: storeroom, label: "Smugglers in the storeroom"}
