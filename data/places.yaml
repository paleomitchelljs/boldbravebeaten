    - "#......P+..............##"
    - "#......##......R.......##"
    - "#......##..............##"
    - "###+#####..............##"
    - "###.#####..............##"
    - "#......#########+########"
    - "#....p.#########.########"
    - "#..g...##....#.........##"
    - "#.......V.C..#.......l.##"
    - "#########..q.#.........##"
    - "#########....#.........##"
    - "#########################"
    - "#########################"
  legend:
