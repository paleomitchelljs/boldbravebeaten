    i: {kind: note, sprite: standing_stone, sets: [read_sarnak_glyphs], label: "A stone cut with glyphs", text: "The stone is old — older than the fortress. The glyphs are not sarnak: they are Suracayl, the same script cut into the temple walls to the north. A map of rivers, a clutch of eggs, and a line dividing them. Below it, a shape like a coiled shadow with no face."}
