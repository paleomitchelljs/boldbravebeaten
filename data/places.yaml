  # (- : * &), each 3 squares in from the last. One stair design, two squares wide, on the south face of every tier
  # (the user: "a single, well-matched set of north-south stairs ... at all levels"): the way up zigzags from the west
  # end to the east end and back, then up the middle. Laid out with a throwaway script (it is all straight lines).
