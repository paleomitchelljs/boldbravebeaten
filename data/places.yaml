    bar: {foes: [{monster: fireGoblin, n: 2}, {monster: fireGoblinArcher}], text: "The drinkers come over the bar at you; one grabs a bow off the wall."}
    sleepers: {foes: [{monster: fireGoblin, n: 3}], text: "Three goblins tumble out of their blankets, cursing. One grabs a spear; the others go for whatever's nearest."}
    patriarch: {foes: [{monster: goblinShaman}], text: "A tall, lean goblin with one milky eye pushes through the beads. He looks tired of all of this."}
    smiths: {foes: [{monster: goblinWarrior, n: 2}], text: "The goblin smiths turn from the anvil, hammers still red."}
    shaman: {foes: [{monster: goblinHighShaman}], text: "The high shaman looks up from its slates, and the torches lean toward it."}
    guardpost: {foes: [{monster: goblinWarrior, n: 2}], text: "A goblin painted like a broken clockwork man comes at you, to the others' delight."}
    champions: {foes: [{monster: goblinChampion}], text: "A champion rolls off its furs and takes up its blade. It's been waiting for something worth killing."}
    throne: {foes: [{monster: goblinKing}], flags: [ember_king_dead], text: "The king heaves himself up from the throne. He has been king a long time and does not intend to stop."}
    bodyguard: {foes: [{monster: goblinChampion}], text: "A champion turns, astonished, as the wall opens."}
  wandering:
    - {w: 1, foes: [{monster: goblinWarrior}], text: "An inferno goblin rounds the bend, torch guttering. It spots you and snarls."}
    - {w: 4, nothing: true}
  secrets: []

