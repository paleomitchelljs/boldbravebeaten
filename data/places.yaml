    storeroom: {foes: [{monster: smuggler}, {monster: smuggler}], text: "Two smugglers sorting crates look up and reach for weapons."}
    boss: {foes: [{monster: smugglerBoss}, {monster: smuggler}], flags: [cellars_cleared], text: "The captain puts down his ledger and draws his sword. The other one grabs a club. Neither of them looks surprised."}
  wandering:
    - {w: 1, foes: [{monster: smuggler}], text: "A smuggler carrying a crate drops it and pulls a knife."}
    - {w: 4, nothing: true}
