    j: {kind: stairs, to: ember_jail, at: D, up: true, sprite: none, label: "The stair up to the goblin jail"}
    C: {kind: stairs, to: ember_citadel, at: D, sprite: none, label: "The ramp down to the giants' gates"}
    b: {kind: note, label: "Black glass", text: "The walls here are glass, black and rippled where the rock ran like water and froze. Your torch looks back at you from every face."}
    o: {kind: note, label: "The ledge", text: "The duct opens on a ledge over a lake of magma. Across it, cut square into the cavern wall, is a gate taller than a goblin's castle: iron doors, and a barred window looking out over the fire."}
    e: {kind: monster, encounter: crawlers, label: "Something scrapes in the duct"}
    f: {kind: monster, encounter: flare, label: "A light in the dark that is not a torch"}
    i: {kind: monster, encounter: imps, label: "Shapes over the magma"}
  encounters:
    crawlers: {foes: [{monster: lavaBeetle}, {monster: lavaBeetle}], text: "Two lava beetles back out of a side crack, mandibles open."}
    flare: {foes: [{monster: fireElemental}], text: "A fire elemental drifts up the duct, lighting the glass."}
    imps: {foes: [{monster: imp}, {monster: imp}], text: "Imps rise off the magma, laughing."}
  wandering:
    - {w: 1, foes: [{monster: lavaBeetle}], text: "A lava beetle, following the warmth."}
    - {w: 1, foes: [{monster: imp}], text: "An imp out hunting."}
    - {w: 3, nothing: true}
  secrets: []

