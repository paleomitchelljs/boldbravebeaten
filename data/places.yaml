    - "###+#####..............##"
    - "###.#####..............##"
    - "#......#########+########"
    - "#....p.#########.########"
    - "#..g...##....#.........##"
    - "#.......V.C..#.......l.##"
    - "#########..q.#.........##"
    - "#########....#.........##"
