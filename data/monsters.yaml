# Monsters. attrs may exceed the human cap. natural = natural weapons (weapons.yaml). group lists a pack.
# traits are mechanical hooks: pack, regrow, resist, tireless, apMult, staminaMult, size, aura, and so on.
# resist is by damage keyword (docs/DATA.md, Damage keywords): {P, S, B, fire, mind, life, ...}; 0 immune, 1.5 weak.

# faction: whose standing a kill costs; xp: per creature; glyph: how it shows in the first-person view;
# loot: a table in items.yaml rolled when it dies (its carried gear is also left on the body).
# level: the place it is made for; tier: what it is meant to be against heroes of that level (1 very weak … 5 boss,
# 6 epic; docs/DATA.md, tools/tiers.js); parts: body parts cut from it (items.yaml goods of kind part).

