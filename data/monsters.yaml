  blurb: "The master of the palace, a horned lizard in a dark robe floating above its throne. Skeletons stand guard for it, the fallen get up again at its word, and it fills the hall with fear."
  faction: suracayl
  xp: 250
  glyph: "💀"
  sprite: {art: venril, kind: orc_shaman}
  loot: humanoid_purse
  level: 6
  attrs: {STR: 7, CON: 9, DEX: 6, SPD: 6, INT: 10, WIL: 11, WIS: 9, CHA: 10}
  skills: {melee: 2, arcane: 6, anticipation: 3, deception: 3}
  natural: []
  weapons: [staff]
  armor: bogSkin
  keepUnarmed: true
  nouns: [bone, shadow, fear]
  feats: {verb_raise: 1, verb_launch: 1, verb_beguile: 1, toughness: 1}
revenantKnight:
  name: Revenant knight
  blurb: "An end-game knight: masterwork dwarven steel plate, an adamant shield, a blade that drinks stamina and wounds, a withering burst, an aura of dread that saps everyone near him, a silk sash that quickens him, and the dead rise for him."
  faction: grave_cult
  xp: 400
  glyph: "⚔"
  sprite: {art: shadow-knight, kind: skeleton_warrior, scale: 1.25, tint: "#4a4a5a"}
  loot: barrow_hoard
  level: 20
  attrs: {STR: 10, CON: 10, DEX: 8, SPD: 7, INT: 10, WIL: 10, WIS: 7, CHA: 8}
  skills: {melee: 9, block: 8, armor: 9, arcane: 6, anticipation: 6, intimidation: 7}
  natural: []
  keepUnarmed: true
  nouns: [life, shadow, fire]
  craft: master
  armorItem: {type: plate, material: steel, origin: dwarven}
  weaponItems:
