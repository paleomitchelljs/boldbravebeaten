    - power_swing
    - heavy_tempo
    - quick_parry
    - agility
    - agility
    - toughness
    - toughness
    - heavy_tempo
    - riposte
    - iron_stance
revenantCourt:
  name: Revenant knight and his dead
  blurb: The revenant knight with two skeletons at his side.
  group: [revenantKnight, skeleton, skeleton]
raptor:
  name: Raptor
  blurb: "A small, quick hunter in feathers: a sickle claw and a bite, never alone. Fast enough to get round the line; thin-skinned."
  faction: wilds
  xp: 25
  glyph: "🦖"
  sprite: {art: raptor, kind: orc, scale: 0.7, tint: "#8a6a4a"}
  loot: beast_leavings
