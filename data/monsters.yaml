  traits: {size: 1.2, constrict: {stamina: 6, con: 1}, slippery: 1}
  feats: {pin: 1}
  policy: {grappler: true}
avatarOfFear:
  name: Avatar of Fear
  blurb: "A hulking faceless thing, twice a man's height. Long arms strike from two squares away and every blow that lands drinks stamina; dread rolls off it (frightens those beside it unless they resist). Acts like one and a half fighters."
  faction: grave_cult
  xp: 400
  glyph: "👹"
  sprite: {art: avatar, kind: orc_warrior, scale: 1.8, tint: "#b05a2a"}
  level: 10
