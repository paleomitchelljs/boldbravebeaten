raptorPack: {name: Raptor pack, blurb: Three raptors., group: [raptor, raptor, raptor]}
alligator:
  name: Alligator
  blurb: "Lies still in the sewer water, then seizes one victim and rolls with it, crushing (as the constrictor). Thick hide; slow on land."
  faction: wilds
  xp: 60
  glyph: "🐊"
  sprite: {art: alligator, kind: orc, scale: 0.9, tint: "#5a6a4a"}
  attrs: {STR: 14, CON: 12, DEX: 4, SPD: 4, INT: 1, WIL: 5, WIS: 4, CHA: 1}
