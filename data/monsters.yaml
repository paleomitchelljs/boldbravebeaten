  natural: [tail]
  armor: scalewardScales
  weapons: [warhammer]
  traits: {}
  feats: {heavy_weapon_training: 1, toughness: 1}
  keepUnarmed: true
scalewardPair: {name: Suracayl warriors, blurb: Two Suracayl warriors., group: [scaleward, scaleward]}
suracaylSkink:
