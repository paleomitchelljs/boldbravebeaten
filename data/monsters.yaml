# PROVISIONAL (the user, 2026-11-08): what Summon + Death brings. Only spells and magical weapons touch it; its touch
# (Take + Death, a power of its own) passes armor and takes only stamina, never attributes: it can exhaust you, not
# kill you. A shell of force or a ward of Death keeps it off.
ghost:
