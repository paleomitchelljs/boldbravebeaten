      name: Soulreaver
      enchantments: [drinking, keen]
  sidearm: dagger
  shieldItem: {size: heater, material: adamant}
  trinkets: [{name: Flowing black silk sash, attrs: {SPD: 1}, ap: 1}]
  traits: {aura: {name: aura of dread, radius: 2, stamina: 3, cond: dread}}
  featPrefs:
    - verb_strike
    - verb_launch
    - verb_burst
    - verb_bless
    - battle_casting
    - verb_conjure
    - mod_strong
    - verb_raise
    - plate_mobility
    - plate_mobility
    - half_swording
    - plate_endurance
    - quick_block
    - iron_stance
    - plate_endurance
    - living_fortress
    - strength
    - toughness
    - riposte
    - control
    - quick_casting
    - half_swording
spectre:
  name: Spectre
  blurb: "A high-level undead. Only spells and magical weapons hurt it; its scythe drinks life; its wail panics the living near it."
  faction: grave_cult
  xp: 320
  glyph: "👻"
  sprite: {art: bone-wraith, kind: skeleton_mage, tint: "#8ab4d9"}
  level: 15
  attrs: {STR: 10, CON: 14, DEX: 9, SPD: 9, INT: 9, WIL: 12, WIS: 8, CHA: 10}
