# Items other than the weapons, armor and shields in their own files, plus loot tables.
#
# goods: kind = supply | potion | key | book | trinket | trade | component.
#   value: base price in gold (falls back to rarity). use: what using it does (potion, supply).
#   supply: engine: bandages | arrows | bodkins -> pooled in the party's supplies.
#   book: teaches: {noun: fire} (a magic noun) or reveals: [secret ids] (Lore).
#   trinket: something worn: slot = a worn slot (rules.yaml game.wornSlots: head, neck, shoulders, cape, arms, hands,
#     legs, feet) or ring (either ring slot); attrs {SPD: 1}; ap: extra AP; effects: what it does (see
#     enchantments.yaml for the keys); power: a spell it casts ({verb, noun, mod, charges, name}).
#     Weapons, armor and shields with magic are gear in tables and stock: a type + tags + enchantments + name.
# tables: loot. Each entry has w (weight) and one of
#   gold: [min, max] | good: id, n: [min, max] | weapon: id | armor: id, coverage | shield: size, material
#   | nothing: true. Gear may add its tags: material, origin, craft (poor, average, master), enchantments.

goods:
