# Tilesets for the map (src/ui/game/tilemap.js). A place draws from one with look: {tileset: <id>}; without one it
# has the 3/4 dungeon walls of art/worldtiles/tiles.png. A terrain with no sheet yet is drawn in its colour.
#   cell      pixels per square in the art (64 for PixelLab). The map is drawn at cell/16 times the 16-px grid, so
#             one art pixel is one screen pixel before the page scales the canvas.
#   dir       the folder of the sheets
#   floor     the terrain plain floor ('.'), doors and legend squares are drawn as (default: the first terrain)
#   wall      the terrain of walls and rock (default: wall)
#   doorsInWall  doorways (and legend squares with `wall: true`) are drawn as wall, with the door prop for the side
#             they open on laid over them: door_south (a door in the face), door_east, door_west, door_north (a way
#             through the wall top seen from above), else door; a locked door takes door_locked_south... first
#   terrains  name -> how it is drawn, from the bottom up. Ground letters (rules.yaml game.ground) name these by `tile`.
#     color     flat colour while there is no art; alpha (0-1) lays it over the floor instead (a patch of rubble)
#     tile      an image of one square (a list: variants, picked by position)
#     wang      a 16-tile corner sheet of this terrain (upper) over the terrain named by `over` (lower). Each tile sits
#               on a corner between four squares and is chosen by which of them are this terrain (or one listed after
#               it, except the wall unless this is the wall), so edges and corners join up. Its all-lower tile also serves as the plain `over` ground.
#     cols      tiles across the sheet (default 4)
#     corners   the sheet's tiles in reading order, each four letters NW NE SW SE (U upper, L lower). Default: the
#               PixelLab layout, [UULU, ULUL, LULL, UULL, LUUL, ULLL, LLLL, LLLU, ULUU, LLUU, LLUL, LULU, UUUU, UUUL,
#               ULLU, LUUU]. PixelLab's tileset tool reports each tile's corners; copy them here if they differ.
#               A code listed again is a variant of the first tile with those corners (a mosaic in a wall face).
#     vary      the share of corners with variants that draw one (default 0.25), picked by position
#     apart     flat ground listed before this one doesn't count it as its own: it draws its own edge where it meets
#               this (a plank deck over water, its sheet's lower ground transparent, lies over the walkway's lip).
#               A bridge (ground with `under`) whose terrain has a wang sheet is drawn as that terrain, not laid over
#     like      another terrain to copy every field from (its cliff list, decor); fields given here win. It keeps its
#               own rank, so a pyramid's tiers can share one layout and each draw over the last
#     cliff     instead of corners: a PixelLab cliff set (transition_size 1, 25 tiles) as [col, row, pattern], the
#               pattern 16 letters, row by row, of the 4x4 squares around the tile's corner: 0 lower, 1 upper, 2 the
#               wall's last row (its face), . any (from the metadata's pattern_4x4). Each corner takes the best-scoring
#               tile; tiles that tie are variants, picked by position.
#     solo      (a cliff set) counts only its own squares (and cliff sets built on it, by `over`) as its upper ground,
#               not the other cliff sets ranked above it
#     underWalls  (a cliff set) runs on under a wall beside it, east or west: a pyramid built into a wall; `all`, on any side (a built
#               wall running into natural rock at its ends)
#     cut       (the wall) its sheet with the ground cut away, drawn where it meets an underWalls terrain; (a flat
#               corner set over a moving terrain) its sheet with that terrain cut away, so it shows through
#     anim      a moving terrain (lava), drawn every frame under the rest: {sheet, size, frames, cols, fps}, one
#               seamless surface `size` art pixels a side, `frames` of them, `cols` to a row; each square draws the
#               part of it under its position. spurt: [sheet, w, h, frames, fps] and every (seconds): a jet now and
#               then from one square in five whose four neighbours are this terrain too
#     decor     pieces scattered on plain squares of this terrain: {density, pieces: [[image, x, y, w, h], ...], clump,
#               spread, margin, edge}. density: pieces per square (above 1, more than one try); clump: squares per
#               swell of a noise that gathers them in drifts; spread: art pixels a piece may hang over its square;
#               edge: also on squares bordering a terrain drawn under this one (default: only where all eight
#               neighbours are the same); flip: pieces may mirror left to right. A square never takes the piece its
#               west and north neighbours would take first, so identical sprites don't stand side by side
#     faces     (a wall) pieces on its south face where it runs straight: {density, band: [top, height], pieces, drop},
#               drop: art pixels a piece may hang lower than its set height
#               band and a piece's optional sixth number (its height) are measured from the top of the square in front
#   props     name -> [image, x, y, w, h], in the art's pixels: map objects (a well, a statue) for legend props and
#             drops by `sprite`, drawn with their feet at the square's bottom and one cell to one square. With two
#             more numbers [.., dx, dy] it is laid at that offset from the square's top-left instead (a doorway or a
#             stair cut to fit the wall around it, which may reach into the next square).
#             Two more [.., dx, dy, frames, fps] (dx, dy may be null) play an animation: `frames` pictures side by side
#             from x, each w wide, at fps (a waterfall, grass in the wind).

# The temple's open courts, built in layers: plain ground and plain wall tops from PixelLab sets, with the variety in
# small pieces scattered over them (decor) and on the wall faces (faces). Prompts: assets/wip/temple-court/.
temple_court:
  doorsInWall: true
  cell: 64
  dir: art/worldtiles/temple/
  floor: grass
  terrains:
    grass:
      color: "#5f7d42"
      tile: court-grass.png
      # tuft, fern, broken bricks, pebbles, flowers, feathery fern, ground cover
      decor: {density: 1.1, clump: 5, flip: true, pieces: [[court-decor.png, 0, 0, 22, 23], [court-decor.png, 64, 0, 26, 24], [court-decor.png, 128, 0, 28, 24], [court-decor.png, 192, 0, 16, 10], [court-decor.png, 256, 0, 10, 11], [court-decor.png, 896, 0, 38, 36], [court-decor.png, 1024, 0, 34, 27]]}
    ferns:
      color: "#4a4030"
      wang: court-loam.png
      over: grass
      # large and small fern, feathery fern, broad-leaf plant, palm seedling, ground cover, fern tuft
      decor: {density: 0.9, edge: true, spread: 14, flip: true, pieces: [[court-decor.png, 704, 0, 58, 56], [court-decor.png, 768, 0, 43, 44], [court-decor.png, 896, 0, 38, 36], [court-decor.png, 832, 0, 36, 38], [court-decor.png, 960, 0, 26, 32], [court-decor.png, 1024, 0, 34, 27], [court-decor.png, 64, 0, 26, 24]]}
    rubble:
      color: "#bba57a"
      wang: court-paving.png
      over: grass
      decor: {density: 1, edge: true, spread: 6, pieces: [[court-decor.png, 128, 0, 28, 24], [court-decor.png, 192, 0, 16, 10], [court-decor.png, 0, 0, 22, 23], [court-decor.png, 448, 0, 17, 32], [court-decor.png, 128, 0, 28, 24]]}
    water: {color: "#1f4450"}
    shallows: {color: "#3b6a70"}
    bridge: {color: "#7a5a36"}
    # The pyramid's tiers (court 2), each a cliff set over the one below, ranked in order so each draws over the last:
    # the first rises from the grass, the rest from the terrace below (assets/wip/temple-pyramid/). Risers (`^`) are
    # drawn as the tier they hold up. Same 25-tile layout as the wall.
    tier1:
      color: "#bab286"
      wang: pyramid-tier1.png
      over: grass
      cliff:
        - [2, 2, ".....00..00....."]
        - [3, 2, ".....00..01....."]
        - [1, 4, ".....00..11....."]
        - [2, 4, ".....00..10....."]
        - [3, 3, ".00..01..01....."]
        - [3, 4, ".....01..01....."]
        - [0, 6, ".....11..11....."]
        - [1, 0, ".11..10..10....."]
        - [1, 1, ".....10..10....."]
        - [0, 4, ".....10..11....."]
        - [3, 6, ".....01..11....."]
        - [1, 6, ".....11..12...0."]
        - [3, 0, ".....11..22..00."]
        - [1, 2, ".....10..20..00."]
        - [1, 7, ".1...12..10....."]
        - [3, 1, ".11..22..00....."]
        - [1, 3, ".....20..00....."]
        - [2, 0, ".....01..02..00."]
        - [0, 0, ".....11..21..0.."]
        - [2, 6, ".....10..21..01."]
        - [2, 1, ".....02..00....."]
        - [0, 1, "..1..21..01....."]
        - [2, 7, ".10..21..01....."]
        - [0, 2, ".....01..12..10."]
        - [0, 3, ".01..12..10....."]
      decor: {density: 0.3, clump: 4, pieces: [[court-decor.png, 384, 0, 24, 20], [court-decor.png, 512, 0, 20, 22], [court-decor.png, 448, 0, 17, 32]]}
    tier2: {like: tier1, wang: pyramid-tier2.png, over: tier1}
    tier3: {like: tier1, wang: pyramid-tier3.png, over: tier1}
    tier4: {like: tier1, wang: pyramid-tier4.png, over: tier1}
    wall:
      color: "#d4b67e"
      wang: court-wall.png
      over: grass
      # A cliff set: 25 tiles picked by the 4x4 pattern around each corner (col, row, pattern). Row 8: the plain top
      # redrawn as large blocks (joints drawn by hand, assets/wip/temple-court/v2/), standing in for the sheet's [0, 6].
      cliff:
        - [2, 2, ".....00..00....."]
        - [3, 2, ".....00..01....."]
        - [1, 4, ".....00..11....."]
        - [2, 4, ".....00..10....."]
        - [3, 3, ".00..01..01....."]
        - [3, 4, ".....01..01....."]
        - [0, 8, ".....11..11....."]
        - [1, 8, ".....11..11....."]
        - [2, 8, ".....11..11....."]
        - [3, 8, ".....11..11....."]
        - [1, 0, ".11..10..10....."]
        - [1, 1, ".....10..10....."]
        - [0, 4, ".....10..11....."]
        - [3, 6, ".....01..11....."]
        - [1, 6, ".....11..12...0."]
        - [3, 0, ".....11..22..00."]
        - [1, 2, ".....10..20..00."]
        - [1, 7, ".1...12..10....."]
        - [3, 1, ".11..22..00....."]
        - [1, 3, ".....20..00....."]
        - [2, 0, ".....01..02..00."]
        - [0, 0, ".....11..21..0.."]
        - [2, 6, ".....10..21..01."]
        - [2, 1, ".....02..00....."]
        - [0, 1, "..1..21..01....."]
        - [2, 7, ".10..21..01....."]
        - [0, 2, ".....01..12..10."]
        - [0, 3, ".01..12..10....."]
      # Wall tops: moss, a vine sprig, a crack.
      decor: {density: 0.4, clump: 4, pieces: [[court-decor.png, 384, 0, 24, 20], [court-decor.png, 512, 0, 20, 22], [court-decor.png, 448, 0, 17, 32], [court-decor.png, 384, 0, 24, 20]]}
      # Faces: five kinds of vine from the lip, a snake mosaic in the face.
      faces: {density: 0.4, drop: 2, band: [-32, 56], pieces: [[court-decor.png, 576, 0, 30, 44, -32], [court-decor.png, 640, 0, 40, 40, -26], [court-decor.png, 576, 0, 30, 30, -32], [court-decor.png, 1088, 0, 9, 34, -32], [court-decor.png, 1152, 0, 48, 35, -32], [court-decor.png, 1216, 0, 17, 41, -32]]}
  # court-props.png: door, steps up the wall, well, a large and a small clump of ferns (PixelLab map objects).
  # Doorways and the steps were inpainted into renders of the walls around them (assets/wip/temple-doors/), so they
  # join the wall; each is laid at its offset from its square.
  props:
    door: [court-props.png, 0, 0, 64, 61]
    door_locked: [court-props.png, 0, 0, 64, 61]
    door_east: [temple-doors.png, 662, 0, 122, 52, -64, 6]
    door_west: [temple-doors.png, 784, 0, 122, 52, 6, 6]
    door_north: [temple-doors.png, 210, 0, 48, 112, 8, 16]
    wall_steps: [temple-doors.png, 110, 0, 100, 56, -58, 4]
    well: [court-props.png, 128, 0, 64, 61]
    fern_large: [court-props.png, 192, 0, 64, 60]
    fern_small: [court-props.png, 256, 0, 64, 56]
    # The pyramid (court 2): one stair, inpainted into a render of the top tier, its join to the face repainted on the
    # top tier and the first (assets/wip/temple-pyramid/); a copy per tier, in halves for its two squares. The altar.
    altar: [pyramid-props.png, 0, 0, 64, 64]
    pyr_stair_l1: [pyramid-props.png, 68, 0, 64, 124, 0, -24]
    pyr_stair_r1: [pyramid-props.png, 136, 0, 67, 124, 0, -24]
    pyr_stair_l2: [pyramid-props.png, 207, 0, 64, 124, 0, -24]
    pyr_stair_r2: [pyramid-props.png, 275, 0, 67, 124, 0, -24]
    pyr_stair_l3: [pyramid-props.png, 346, 0, 64, 124, 0, -24]
    pyr_stair_r3: [pyramid-props.png, 414, 0, 67, 124, 0, -24]
    pyr_stair_l4: [pyramid-props.png, 485, 0, 64, 124, 0, -24]
    pyr_stair_r4: [pyramid-props.png, 553, 0, 67, 124, 0, -24]
    # Lizardfolk huts and clutter (assets/wip/front/).
    hut_round: [../front.png, 0, 149, 104, 109]
    hut_stilts: [../front.png, 106, 149, 100, 113]
    liz_totem: [../front.png, 208, 149, 42, 92]
    liz_urns: [../front.png, 252, 149, 52, 38]
    liz_fishrack: [../front.png, 306, 149, 88, 85]
    liz_nest: [../front.png, 396, 149, 60, 59]
    liz_idol: [../front.png, 458, 149, 58, 58]
    liz_bones: [../front.png, 518, 149, 60, 49]


