# New game: where the party begins, what it carries, and the starter kits to choose from.
# place is home: the town the party wakes in when left for dead, and where leaving a dungeon leads. go: where a new
# game begins (a place and its arrival square, as a trial's go); leave it out to begin in the town.
place: stonebridge
go: {to: temple_court, arrive: "<"}
day: 1
gold: 60
supplies: {bandages: 4, arrows: 0, bodkins: 0}
flags: []
# Starter kits: gear by type. Everyone starts in padded armor with a wooden shield (Philosophy: gear,
# not level). A kit swaps the weapons. Attribute spreads below are suggestions for the creation screen.
kits:
  - {id: sword, name: Sword and board, wield: longsword, sidearm: dagger, armor: padded, shield: round, blurb: "Balanced, steady, a shield between you and trouble."}
  - {id: club, name: Club and board, wield: club, sidearm: dagger, armor: padded, shield: round, blurb: "Blunt, cheap, and does not care about armor."}
  - {id: spear, name: Spear and board, wield: shortSpear, sidearm: dagger, armor: padded, shield: round, blurb: "Reach keeps them off you."}
  - {id: rapier, name: Rapier and dagger, wield: rapier, sidearm: parryingDagger, armor: padded, shield: null, blurb: "Quick and light. Needs room and a clear head."}
  - {id: bow, name: Bow, wield: shortbow, sidearm: dagger, armor: padded, shield: null, arrows: 20, blurb: "Hit them before they hit you."}
  - {id: hammer, name: Warhammer, wield: warhammer, sidearm: dagger, armor: padded, shield: null, blurb: "Two hands, slow, and dents plate."}
  - {id: staff, name: Dagger and ward, wield: dagger, sidearm: null, armor: padded, shield: null, blurb: "A caster's kit: spend the feats on words."}
presets:
  # The default party (the user, 2026-10-28): level 3, five feats each (3 + 1 a level), 40 attribute points.
  # Beren: heavy armor, sword and shield. He blocks: plate he can move in, a shield he is quick and sure with.
  - name: Beren
    kit: sword
    level: 3
    attrs: {STR: 7, CON: 7, DEX: 5, SPD: 5, INT: 3, WIL: 5, WIS: 4, CHA: 4}
    armorItem: {armor: plate, material: steel}
    weaponItems: [{weapon: longsword, material: steel}, {weapon: dagger}]
    shieldItem: {shield: heater, material: wood}
    feats: [plate_mobility, shield_training, plate_endurance, quick_block, shield_training]
    look: {sprite: "art:beren"}
  # Lorc: an archer. There are no archery feats yet, so he is built on a high DEX, his eyes and staying out of reach.
  - name: Lorc
    kit: bow
    level: 3
    attrs: {STR: 5, CON: 5, DEX: 8, SPD: 6, INT: 4, WIL: 4, WIS: 5, CHA: 3}
    armorItem: {armor: leather}
    weaponItems: [{weapon: longbow}, {weapon: dagger}]
    shieldItem: null
    arrows: 30
    feats: [agility, quickness, agility, keen_eye, light_armor_training]
    look: {sprite: "art:lorc"}
  # Cyrus: a swashbuckling fencer, unarmored, all speed: rapier and parrying dagger, quick thrusts, parry and riposte.
  - name: Cyrus
    kit: rapier
    level: 3
    attrs: {STR: 4, CON: 5, DEX: 8, SPD: 8, INT: 4, WIL: 4, WIS: 4, CHA: 3}
    armorItem: null
    feats: [quick_thrust, parry_training, riposte, quickness, dodge_training]
    look: {sprite: "art:cyrus"}
  # The mage (Jabiku's look until there is a mage of their own): fire, from arm's reach to a burst across the room.
  # The kit's dagger, not a staff: a spell needs a free hand (a two-hander takes both) unless you have Battle Casting.
  - name: Jabiku
    kit: staff
    level: 3
    attrs: {STR: 3, CON: 5, DEX: 5, SPD: 5, INT: 8, WIL: 8, WIS: 3, CHA: 3}
    feats: [casting, verb_strike, verb_launch, casting, verb_burst]
    nouns: [fire]
    look: {sprite: "art:jabiku"}

# Trial starts (title screen): a small or one-person party for trying out art and movement. `look` is the character's
# look (sprite: "art:<key>" draws data/art.yaml art); `go` travels there at once (a place and its arrival square).
trials:
  - id: tevax
    label: "Trial: Tevax alone (level 8)"
    go: {to: temple_court, arrive: "<"}
    party:
      # A death knight: mostly martial, in Ebony Mail with the silk sash, and able to raise the dead. Raise sits deep
      # in the magic tree (8 magic feats with Battle Casting), more than a level-8 budget of 10 leaves for fighting, so
      # this trial character gets 6 feats over the budget (16 in all). Trial only; not a rule.
      - name: Tevax Thaukori
        kit: sword
        level: 8
        bonusFeats: 6
        attrs: {STR: 8, CON: 8, DEX: 6, SPD: 6, INT: 6, WIL: 7, WIS: 5, CHA: 5}
        armorItem: {armor: mail, material: steel, craft: master, enchantments: [ebon], name: Ebony Mail}
        weaponItems:
          - {weapon: longsword, material: steel, enchantments: [sapping], name: Ebony Blade}
          - {weapon: dagger}
        shieldItem: {shield: heater, material: steel, enchantments: [spellcatching], name: Spellbreaker}
        trinkets: [silk_sash]
        feats: [shield_training, mail_mobility, quick_block, mail_mobility, shield_training, mail_endurance, iron_stance, strength, casting, verb_strike, verb_bless, mod_strong, verb_conjure, casting, verb_raise, battle_casting]
        nouns: [shadow, life, bone, spirit]
        look: {sprite: "art:tevax"}
