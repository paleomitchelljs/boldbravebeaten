# Templates for generated human foes (bandits, guards). Gear lists are [weight, value] pairs by level band [1-2, 3-5, 6+];
# skills is one {skill: rank} map a band. Feats are preferences, taken as the skills allow.
# The world (the user, 2026-11-07): armor is rare among foes. The rank and file wear cloth (padded) or leather at most;
# only leaders, champions and bosses (a knight, a named foe) wear mail or plate.

bandit:
  faction: cutthroats
  name: Bandit
  sprite: {art: thief, kind: rogue, tint: "#9a8a8a"}
  primary: [DEX, SPD]
  weak: [INT]
  skills: [{melee: 2, evasion: 2, stealth: 2, anticipation: 1, deception: 1}, {melee: 4, evasion: 3, stealth: 3, anticipation: 2, deception: 2}, {melee: 6, evasion: 4, stealth: 4, anticipation: 3, deception: 3}]
  armor: [[[3, padded], [1, leather]], [[2, padded], [1, leather]], [[1, padded], [2, leather]]]
  coverage: [[[2, partialHead], [2, halfHead], [1, full]], [[1, halfHead], [2, full]], [[1, full]]]
  weapons:
    - [[2, club], [2, dagger]]
    - [[1, club], [1, dagger], [1, spikedMace]]
    - [[1, rapier], [1, spikedMace]]
  shield: [[[2, null], [2, buckler]], [[1, null], [2, buckler]], [[1, buckler], [1, round]]]
  sidearm: dagger
  feats:
    - quick_thrust
    - light_touch
    - trip
    - kip_up
    - precision
    - fleet_foot
    - agility
    - quickness
