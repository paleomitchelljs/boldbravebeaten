# Templates for generated human foes (bandits, guards). Gear lists are [weight, value] pairs by level band [1-2, 3-5, 6+].

bandit:
  faction: cutthroats
  name: Bandit
  sprite: {kind: rogue, tint: "#9a8a8a"}
  primary: [DEX, SPD]
  weak: [INT]
  armor: [[[3, padded], [1, leather]], [[2, leather], [1, mail]], [[1, leather], [2, mail]]]
  coverage: [[[2, partial], [2, half], [1, full]], [[1, half], [2, full]], [[1, full]]]
  weapons:
    - [[2, club], [2, dagger]]
    - [[1, club], [1, dagger], [1, spikedMace]]
    - [[1, rapier], [1, spikedMace]]
  shield: [[[2, null], [2, buckler]], [[1, null], [2, buckler]], [[1, buckler], [1, round]]]
  sidearm: dagger
  feats:
    - quick_thrust
    - light_touch
    - trip
    - dodge_training
    - kip_up
    - precision
    - fleet_foot
    - agility
    - quickness
