# Creature art (art/characters/creatures; git-ignored until its licence is settled: art/README.md). Each sheet is two frames side by side.
# A monster, foe template or NPC uses it with sprite: {art: <key>, ...}; its `kind` is drawn instead wherever the art
# can't be loaded (a fresh clone, the Pages build). A party member can pick an entry with party: true.
#   anims   which sheets exist (<key>-<anim>.png); run uses walk, attack is shown on a blow
#   faces   which way the figure looks as drawn (the map mirrors it to face where it goes)
#   height  how tall it stands on the map, in squares; maxWidth caps a long body (default 1.8)
#   box     the figure's trimmed box in the idle frame [x0, y0, x1, y1] (feet at y1), measured from the sheet
# pixellab entries are 8-direction characters (art/characters/pixellab; tools/pixellab-pull.js fetches them): `dir`
# is one state's folder, `size` its canvas (a number, or [width, height]), `box` measured on it. rotations: the
# standing views to use, default all eight (leave out a bad one and the nearest stands in). Animations (folders under
# <dir>/animations) are clips:
#   walk    played moving: an animation name (default Walking) with walkFrames (default 4) and walks (the directions
#           it has, default east and west); or {anim, dir, frames, dirs} to take it from another state's folder
#   idle    played standing: an animation name, or {anim, dir, frames, dirs}; frames default 4, dirs all eight
#   attack  played through a blow, the same way
# A clip plays in the direction faced, or mirrored from its twin (west from east); a walk also takes one 45 degrees
# off. Otherwise a walk falls back to the idle clip, and anything else to the standing view. Every file of a
# character is centred on the `size` canvas, so states on larger canvases line up.
# recolor: a ramp [[brightness 0..1, "#rrggbb"], ...] the figure's shading is mapped onto when it loads (one figure
# in another material). floats: true plays the walk standing still as well (a figure that hovers rather than stands).

