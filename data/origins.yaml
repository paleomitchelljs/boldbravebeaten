# Where and in what style an item was made: how its weight trades against durability, damage and protection.
# Placeholder traditions; rename or add freely. `common` is the default and adds nothing to the name.
#   weight      armor: multiplies its SPD, DEX, stamina and regeneration penalties; weapons: multiplies the mass
#               (speed, damage, strain and punch through armor follow from the physics)
#   protect     armor: multiplies slashing and piercing mitigation and pierce resistance; shields: threshold
#   damage      weapons: multiplies damage after the physics
#   durability  multiplies durability
#   value       price multiplier

common: {name: "", weight: 1, protect: 1, damage: 1, durability: 1, rarity: common, value: 1}
elven:
  name: Elven
  weight: 0.75
  protect: 0.95
  damage: 1.1
  durability: 0.85
  rarity: rare
  value: 4
  blurb: "Light for what it does: thinner metal, cleverly shaped. Less to carry, a little less to stop a blow."
