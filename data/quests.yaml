# Quests. Stages advance when `done_when` holds (a condition; see src/game/conditions.js). The last stage
# completes the quest and pays `reward`. Flags are set by topics, map events and defeated encounters.
#   exclusive: [ids] - taking this closes those quests (the sides of a faction conflict).

# The old town quests are in tests/fixtures/legacy.yaml.
ember_king:
  name: The Goblin King
  giver: gnome_warden
  faction: deep_gnomes
  summary: The gnomes of the fort have been walled up across the lava for eleven years. Their warden wants the goblin king dead.
  stages:
    - {text: "Kill the goblin king on his throne in the castle beyond the gate court.", done_when: {flag: ember_king_dead}}
    - {text: "Tell Warden Odda in the gnome fort.", done_when: {flag: told_odda_king}}
  reward: {gold: 150, xp: 300, standing: {deep_gnomes: 20}, renown: 3}
